<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Starry Night Ball – Ballroom Broadcast</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --gold: #f6d58b;
    --gold-soft: #f4d28a;
    --black: #000000;
    --offwhite: #ffffff;
    --red: #ff3b30;
    --green: #166534;

    --safe-top: 1.6vh;
    --safe-bottom: 2vh;
    --safe-horiz: 2vw;

    --panel-bg: rgba(0,0,0,0.9);
    --panel-border: #3a3a3a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: Calibri, Arial, sans-serif;
    background: #000 url("tvbackground.png") center/cover no-repeat fixed;
    color: var(--offwhite);
    overflow: hidden;
  }

  .frame {
    width: 100vw;
    height: 100vh;
    padding: var(--safe-top) var(--safe-horiz) var(--safe-bottom) var(--safe-horiz);
    display: flex;
    flex-direction: column;
  }

  /* HEADER */
  .header {
    position: relative;
    flex: 0 0 auto;
    text-align: center;
    margin-bottom: 0.6vh;
  }

  .header-title {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(2.2rem, 3.4vw, 4.2rem);
    color: #000;
    text-shadow:
      0 0 6px rgba(246,213,139,0.9),
      0 0 12px rgba(246,213,139,0.7),
      0 0 18px rgba(0,0,0,0.9);
    line-height: 1.06;
  }

  .marymount-logo-top {
    position: absolute;
    right: 0;
    top: 0;
    max-height: 7vh;
    object-fit: contain;
    filter: drop-shadow(0 0 6px rgba(0,0,0,0.9));
  }

  /* MAIN SPLIT */
  .stage {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 1.2vw;
  }

  .panel {
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    box-shadow: 0 0 6px rgba(0,0,0,0.6);
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  /* LEFT: ITEM CAROUSEL */
  .carousel {
    padding: 1.2vh 1.2vw;
    gap: 1vh;
  }

  .video-frame {
    flex: 1 1 auto;
    min-height: 0;
    background: #111;
    border: 1px solid var(--panel-border);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .video-frame iframe {
    width: 100%;
    height: 100%;
    border: 0;
  }

  /* placeholder shown when an item has no video */
  .video-placeholder {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(2rem, 4vw, 5rem);
    color: var(--gold);
    text-align: center;
    padding: 0 2vw;
  }

  .item-meta {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: end;
    gap: 0.6vw;
    padding-top: 1vh;
  }

  .item-name {
    font-size: clamp(1.1rem, 1.9vw, 2.4rem);
    font-weight: 800;
    color: var(--gold-soft);
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }

  .item-desc {
    font-size: clamp(0.85rem, 1.1vw, 1.4rem);
    color: var(--offwhite);
    margin-top: 0.4vh;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .item-bid {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    font-size: clamp(2rem, 4vw, 5rem);
    color: var(--gold);
    line-height: 1;
    white-space: nowrap;
  }

  .item-bid-label {
    display: block;
    font-family: Calibri, Arial, sans-serif;
    font-size: clamp(0.7rem, 0.9vw, 1.1rem);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--offwhite);
    text-align: right;
  }

  .sponsor {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 0.8vw;
    padding-top: 1vh;
    border-top: 1px solid var(--panel-border);
    margin-top: 1vh;
    min-height: 6vh;
  }

  .sponsor img { max-height: 5vh; max-width: 14vw; object-fit: contain; }

  .sponsor-name {
    font-size: clamp(0.75rem, 0.95vw, 1.1rem);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--offwhite);
  }

  /* RIGHT: LEADERBOARD */
  .leaderboard { padding: 1.2vh 1vw; }

  .leaderboard-title {
    flex: 0 0 auto;
    text-align: center;
    font-size: clamp(0.9rem, 1.2vw, 1.5rem);
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold-soft);
    padding-bottom: 1vh;
    border-bottom: 1px solid var(--panel-border);
  }

  .leaderboard-rows {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    overflow: hidden;
  }

  .lb-row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 0.6vw;
    padding: 0.4vh 0.2vw;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .lb-item {
    font-size: clamp(0.75rem, 1vw, 1.3rem);
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .lb-bid {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    font-size: clamp(0.85rem, 1.1vw, 1.5rem);
    color: var(--gold);
    white-space: nowrap;
  }

  /* FOOTER */
  .footer {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 2vw;
    height: 8vh;
    padding-top: 0.8vh;
  }

  .footer-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
  }

  .qr-img {
    max-height: 6vh;
    background: rgba(255,255,255,0.98);
    padding: 0.3vh;
    border-radius: 0.3rem;
    box-shadow: 0 0 8px rgba(0,0,0,0.9);
  }

  .footer-block span {
    font-size: clamp(0.7rem, 0.85vw, 1rem);
    font-weight: 700;
    color: #000;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    text-shadow: 0 0 3px rgba(255,255,255,0.7);
  }

  .footer-sponsors {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    pointer-events: none;
  }

  .footer-sponsors img {
    max-height: 100%;
    max-width: 100%;
    object-fit: contain;
    filter: drop-shadow(0 0 5px rgba(0,0,0,0.8));
  }

  /* OVERLAYS */
  .banner {
    position: fixed;
    top: 28%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9000;
    display: none;
    white-space: nowrap;
    max-width: 96vw;
    padding: 0.7rem 1.4rem;
    border: 2px solid var(--gold);
    border-radius: 0.6rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    color: #fff;
    font-weight: 800;
    font-size: clamp(18px, 3vw, 54px);
    text-transform: uppercase;
    pointer-events: none;
  }

  .banner.is-visible { display: block; }

  #banner-closing {
    background: linear-gradient(180deg, rgba(255,0,0,0.92), rgba(200,0,0,0.92));
  }

  #banner-closed {
    background: var(--green);
    z-index: 9500;
  }

  .banner-pulse { animation: pulse 1.2s infinite alternate; }

  @keyframes pulse {
    0%   { transform: translateX(-50%) scale(1); }
    100% { transform: translateX(-50%) scale(1.05); }
  }

  #overlay-sold {
    position: fixed;
    inset: 0;
    z-index: 10000;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: rgba(0,0,0,0.88);
  }

  #overlay-sold.is-visible { display: flex; }

  .sold-word {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(4rem, 12vw, 16rem);
    color: var(--gold);
    line-height: 1;
  }

  .sold-item {
    font-size: clamp(1.2rem, 2.6vw, 3.4rem);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-top: 1vh;
  }

  .sold-price {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    font-size: clamp(2.5rem, 7vw, 9rem);
    color: var(--gold);
    margin-top: 1vh;
  }

  #confetti-canvas {
    position: fixed;
    inset: 0;
    z-index: 10001;
    pointer-events: none;
  }

  @media (prefers-reduced-motion: reduce) {
    .banner-pulse { animation: none; }
  }
</style>
</head>
<body>

<div class="frame">

  <div class="header">
    <div class="header-title">The Starry Night Ball</div>
    <img class="marymount-logo-top" src="Marymount%20Logo.png" alt="Marymount Logo" />
  </div>

  <div class="stage">

    <!-- LEFT: item carousel -->
    <div class="panel carousel">
      <div class="video-frame" id="video-frame">
        <div class="video-placeholder" id="video-placeholder">Item name</div>
      </div>

      <div class="item-meta">
        <div>
          <div class="item-name" id="item-name">ITEM 01 – Placeholder item</div>
          <div class="item-desc" id="item-desc">Item description goes here.</div>
        </div>
        <div>
          <span class="item-bid-label">Leading bid</span>
          <span class="item-bid" id="item-bid">€0</span>
        </div>
      </div>

      <div class="sponsor" id="sponsor">
        <span class="sponsor-name" id="sponsor-name">Sponsored by</span>
      </div>
    </div>

    <!-- RIGHT: leaderboard -->
    <div class="panel leaderboard">
      <div class="leaderboard-title">Leading bids</div>
      <div class="leaderboard-rows" id="leaderboard-rows">
        <div class="lb-row"><div class="lb-item">Waiting for data</div><div class="lb-bid">€0</div></div>
      </div>
    </div>

  </div>

  <div class="footer">
    <div class="footer-block">
      <img class="qr-img" src="2025%20Marymount%20QR%20Code.jpeg" alt="QR code to bid" />
      <span>Scan QR code to bid</span>
    </div>
    <div class="footer-sponsors">
      <img src="Marymount%20Footer%20Sponsors.png" alt="Sponsors" />
    </div>
    <div class="footer-block">
      <img class="qr-img" src="2025%20Marymount%20QR%20Code.jpeg" alt="QR code to bid" />
      <span>Scan QR code to bid</span>
    </div>
  </div>

</div>

<!-- OVERLAYS -->
<div class="banner" id="banner-closing">Auction closing soon — get your final bids in</div>
<div class="banner" id="banner-closed">Auction closed — thank you</div>

<div id="overlay-sold">
  <div class="sold-word">Sold</div>
  <div class="sold-item" id="sold-item">Item name</div>
  <div class="sold-price" id="sold-price">€0</div>
</div>

<canvas id="confetti-canvas"></canvas>

<script>
  /* SKELETON ONLY — no data fetch, no timers yet.
     Manual test hooks, call these from the console:
       __test.closing(true|false)
       __test.closed(true|false)
       __test.sold("ITEM 12 – Signed jersey", "€1,250")
  */
  window.__test = {
    closing(on) {
      const b = document.getElementById('banner-closing');
      b.classList.toggle('is-visible', !!on);
      b.classList.toggle('banner-pulse', !!on);
    },
    closed(on) {
      document.getElementById('banner-closed').classList.toggle('is-visible', !!on);
    },
    sold(name, price) {
      document.getElementById('sold-item').textContent = name;
      document.getElementById('sold-price').textContent = price;
      const o = document.getElementById('overlay-sold');
      o.classList.add('is-visible');
      setTimeout(() => o.classList.remove('is-visible'), 7000);
    }
  };
</script>

</body>
</html>
