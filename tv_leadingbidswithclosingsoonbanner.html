
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>The Starry Night Ball – Live Bids</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes, maximum-scale=5" />
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet" />

<style>
:root {
  --gold: #f6d58b;
  --gold-soft: #f4d28a;
  --black: #000000;
  --offwhite: #ffffff;
  --red: #ff3b30;

  --safe-top: 1.6vh;
  --safe-bottom: 6vh;
  --safe-horiz: 3vw;

  --footer-h: 7.2vh;      /* original height */
  --footer-nudge-up: 2vh; /* keeps outer frame visible */

  --rowH: 40px;
  --row-gap: 0.22vh;
}

body {
  margin: 0;
  font-family: Calibri, Arial, sans-serif;
  background: #000 url("tvbackground.png") center/cover no-repeat fixed;
  color: var(--offwhite);
  overflow: hidden;
}

.frame {
  width: 100vw;
  height: 100vh;
  padding: var(--safe-top) var(--safe-horiz) calc(var(--safe-bottom) + var(--footer-h)) var(--safe-horiz);
  display: flex;
  flex-direction: column;
}

.header {
  text-align: center;
  margin-bottom: 0.4vh;
}

.header-title {
  font-family: 'Great Vibes', cursive;
  font-size: clamp(2.6rem, 4.2vw, 5rem);
  color: #000;
  text-shadow: 0 0 6px rgba(246,213,139,0.9), 0 0 12px rgba(246,213,139,0.7), 0 0 18px rgba(0,0,0,0.9);
}

.items-grid {
  flex: 1 1 auto;
  display: flex;
  gap: 1.1vw;
  opacity: 0;
  transition: opacity 0.3s ease-in-out;
}

.column {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: var(--row-gap);
}

.item-row {
  display: grid;
  grid-template-columns: 1fr minmax(8ch, 12ch) max-content;
  align-items: center;
  height: var(--rowH);
  background: rgba(0,0,0,0.9);
  border: 1px solid #3a3a3a;
}

.item-label, .item-newbid, .item-amount {
  display: flex;
  align-items: center;
}

.item-label, .item-amount {
  font-size: clamp(14px, calc(var(--rowH) * 0.52), 32px);
}

.item-label {
  padding: 0.16em 0.6em;
  text-transform: uppercase;
  overflow: hidden;
  white-space: nowrap;
}

.item-label strong { color: var(--gold-soft); }

.item-newbid {
  justify-content: center;
  color: var(--red);
  font-weight: 800;
}

.item-amount {
  padding: 0.16em 1em;
  font-weight: 800;
  min-width: clamp(9ch, 11vw, 20vw);
  justify-content: center;
  color: var(--gold-soft);
  border-left: 1px solid #555;
}

/* Footer */
.footer {
  position: fixed;
  left: var(--safe-horiz);
  right: var(--safe-horiz);
  bottom: calc(var(--safe-bottom) + var(--footer-nudge-up));
  height: var(--footer-h);
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 2vw;
}

.footer-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.qr-img {
  max-height: calc(var(--footer-h) * 0.90); /* restore QR size */
  background: #fff;
  padding: 0.4vh;
  border-radius: 0.3rem;
  box-shadow: 0 0 8px rgba(0,0,0,0.9);
  margin-bottom: 0.35vh;
}

.footer-block span {
  font-size: clamp(0.8rem, 1vw, 1.2rem);
  font-weight: 700;
  color: #000;
}

.footer-sponsors img {
  max-height: calc(var(--footer-h) * 0.90); /* restore sponsor logo size */
  max-width: 100%;
  object-fit: contain;
}

/* Banner */
#closing-banner {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  display: none;
  padding: 0.6rem 1rem;
  background: linear-gradient(180deg, rgba(255,0,0,0.92), rgba(200,0,0,0.92));
  border: 2px solid var(--gold);
  border-radius: 0.6rem;
  color: #fff;
  font-weight: 800;
  font-size: clamp(18px, 3.2vw, 56px);
  white-space: nowrap;
}

.banner-pulse { animation: cb-pulse 1.2s infinite alternate; }
@keyframes cb-pulse {
  0% { transform: translate(-50%, -50%) scale(1); }
  100% { transform: translate(-50%, -50%) scale(1.05); }
}
</style>
</head>

<body>
<div id="closing-banner">🚨 AUCTION CLOSING SOON — GET YOUR FINAL BIDS IN! 🚨</div>

<div class="frame">
  <div class="header"><div class="header-title">The Starry Night Ball</div></div>
  <div class="items-grid">
    <div class="column" id="column-left"></div>
    <div class="column" id="column-right"></div>
  </div>
</div>

<div class="footer">
  <div class="footer-block">
    <img class="qr-img" src="2025 Marymount QR Code.jpeg" alt="QR Code Left" />
    <span>Scan QR code to bid</span>
  </div>
  <div class="footer-sponsors">
    <img src="Marymount Footer Sponsors.png" alt="Sponsors" />
  </div>
  <div class="footer-block">
    <img class="qr-img" src="2025 Marymount QR Code.jpeg" alt="QR Code Right" />
    <span>Scan QR code to bid</span>
  </div>
</div>

<script>
const sheetID='1UdOW-OSvZUxlHEzPz0--FDtFcSMTjbZLDo-OhwRr_Mc';
const sheetName='LEADING BIDS';
const range='X5:Z43';
const url=`https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}&range=${range}`;
const euroFmt=new Intl.NumberFormat('en-IE',{maximumFractionDigits:0});
function formatEuro(v){const n=Number(v);return Number.isFinite(n)?`€${euroFmt.format(n)}`:'€0';}
function formatNewBidCell(v){if(v===''||v==null)return'';const n=Number(v);return Number.isFinite(n)?`€${euroFmt.format(n)}`:String(v);}
const escapeHtml=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function boldFirstSevenSafe(t){const safe=escapeHtml(t??'');return `<strong>${safe.substring(0,7)}</strong>${safe.substring(7)}`;}
function applyAlignedRowHeights(totalRows,leftCount,rightCount){
  const itemsGrid=document.querySelector('.items-grid');
  const leftCol=document.getElementById('column-left');
  const availableH=itemsGrid.getBoundingClientRect().height;
  const gapPx=parseFloat(getComputedStyle(leftCol).gap)||0;
  const leftRowH=(availableH-(leftCount-1)*gapPx)/leftCount;
  const rightRowH=(availableH-(rightCount-1)*gapPx)/rightCount;
  document.documentElement.style.setProperty('--rowH',Math.floor(Math.min(leftRowH,rightRowH))+'px');
  itemsGrid.style.opacity=1;
}
function makeRow(r){
  const item=boldFirstSevenSafe((r[0]??'').toString());
  const newBid=formatNewBidCell(r[1]);
  const latest=formatEuro(r[2]??r[1]);
  return `<div class="item-row"><div class="item-label">${item}</div><div class="item-newbid">${escapeHtml(newBid)}</div><div class="item-amount">${latest}</div></div>`;
}
function renderRows(rows){
  const leftCol=document.getElementById('column-left');
  const rightCol=document.getElementById('column-right');
  const half=Math.ceil(rows.length/2);
  leftCol.innerHTML=rows.slice(0,half).map(makeRow).join('');
  rightCol.innerHTML=rows.slice(half).map(makeRow).join('');
  requestAnimationFrame(()=>applyAlignedRowHeights(rows.length,half,rows.length-half));
}
async function loadData(){
  try{
    const res=await fetch(`${url}&cacheBust=${Date.now()}`,{cache:'no-store'});
    const raw=await res.text();
    const start=raw.indexOf('{'),end=raw.lastIndexOf('}');
    const json=JSON.parse(raw.slice(start,end+1));
    const rows=json.table.rows.map(r=>r.c.map(c=>c?c.v:''));renderRows(rows);
  }catch(e){console.error(e);}
}
loadData();setInterval(loadData,5000);
window.addEventListener('resize',()=>{const l=document.getElementById('column-left').children.length;const r=document.getElementById('column-right').children.length;if(l&&r)applyAlignedRowHeights(l+r,l,r);});

/* Banner logic */
function showBanner(){const b=document.getElementById('closing-banner');b.style.display='inline-block';b.classList.add('banner-pulse');}
function hideBanner(){const b=document.getElementById('closing-banner');b.style.display='none';b.classList.remove('banner-pulse');}
function startCycle(onMs,offMs){let showing=true;const tick=()=>{if(showing){showBanner();setTimeout(()=>{showing=false;tick();},onMs);}else{hideBanner();setTimeout(()=>{showing=true;tick();},offMs);}};tick();}
const qp=new URLSearchParams(location.search);
const paramTime=qp.get('banner');
const fallback='20:15';
const chosen=(paramTime&&/^\d{2}:\d{2}$/.test(paramTime))?paramTime:fallback;
const target=new Date();const [hh,mm]=chosen.split(':');target.setHours(hh,mm,0,0);
const delay=target.getTime()-Date.now();
if(delay<=0){startCycle(10000,300if(delay<=0){startCycle(10000,30000);}else{setTimeout(()=>startCycle(10000,30000),delay);}
</script>
</body>
