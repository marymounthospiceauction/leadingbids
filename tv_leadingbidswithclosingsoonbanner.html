
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Starry Night Ball – Live Bids</title>

  <!-- VIEWPORT -->
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes, maximum-scale=5" />

  <!-- Script-style font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet" />

  <style>
    :root {
      --gold: #f6d58b;
      --gold-soft: #f4d28a;
      --black: #000000;
      --offwhite: #ffffff;
      --red: #ff3b30; /* NEW BID colour */

      /* Safe-area padding to counter TV overscan (tune these) */
      --safe-top: 1.6vh;
      --safe-bottom: 6vh;    /* keeps footer fully inside the visible frame */
      --safe-horiz: 3vw;

      /* Footer band height (QR + Sponsors centered) */
      --footer-h: 8vh;       /* bigger band so sponsor can maximize height */
      --footer-nudge-up: 2vh;/* moved up slightly for outer frame visibility */

      /* Shared row height (set by JS) so rows align across columns */
      --rowH: 40px;

      /* Unified vertical gap between rows in both columns */
      --row-gap: 0.22vh;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Calibri, Arial, sans-serif;
      background: #000 url("tvbackground.png") center/cover no-repeat fixed;
      color: var(--offwhite);
      overflow: hidden; /* TVs must not show scrollbars */
    }

    /* FULL-SCREEN CONTAINER – reserve space for footer inside safe area */
    .frame {
      width: 100vw;
      height: 100vh;
      /* IMPORTANT: bottom padding reserves exactly the footer height */
      padding: var(--safe-top) var(--safe-horiz) calc(var(--safe-bottom) + var(--footer-h)) var(--safe-horiz);
      display: flex;
      flex-direction: column;
      background: transparent;
    }

    /* HEADER */
    .header {
      position: relative;
      flex: 0 0 auto;
      margin-bottom: 0.4vh;
      text-align: center;
    }

    .header-title {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(2.6rem, 4.2vw, 5rem);
      font-weight: 400;
      color: #000; /* black for readability */
      text-shadow:
        0 0 6px rgba(246,213,139,0.9),
        0 0 12px rgba(246,213,139,0.7),
        0 0 18px rgba(0,0,0,0.9);
      letter-spacing: 0.04em;
      line-height: 1.06;
    }

    /* ITEMS GRID – fills remaining vertical space explicitly */
    .items-grid {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      gap: 1.1vw;       /* horizontal gap between columns */
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
      margin-top: 0.2vh;
      margin-bottom: 0.2vh;
      overflow: hidden; /* no scrollbars on TV */
    }

    .column {
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      gap: var(--row-gap);  /* unified gap used in calculations */
    }

    .item-row {
      display: grid;
      /* 3 columns: label | NEW BID (Y) | LATEST BID (Z) */
      grid-template-columns: 1fr minmax(8ch, 12ch) max-content;
      align-items: center;
      height: var(--rowH);              /* exact, shared height per row */
      background: rgba(0,0,0,0.9);
      border: 1px solid #3a3a3a;
      box-shadow: 0 0 4px rgba(0,0,0,0.5);
    }

    .item-label,
    .item-newbid,
    .item-amount {
      display: flex;
      align-items: center;
      line-height: 1.12;
    }

    /* Labels & LATEST BID scale a touch larger */
    .item-label,
    .item-amount {
      font-size: clamp(14px, calc(var(--rowH) * 0.52), 32px);
    }

    .item-label {
      padding: 0.16em 0.6em;
      text-transform: uppercase;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .item-label strong {
      font-weight: 800;
      color: var(--gold-soft);
      letter-spacing: 0.02em;
    }

    .item-newbid {
      /* slightly smaller than other columns, centered, red */
      justify-content: center;
      text-align: center;
      color: var(--red);
      font-weight: 800;
      font-size: clamp(12px, calc(var(--rowH) * 0.46), 28px);
      letter-spacing: 0.02em;
    }

    .item-amount {
      padding: 0.16em 1.0em;
      font-weight: 800;

      /* reserve width for big € amounts; keeps layout stable */
      min-width: clamp(9ch, 11vw, 20vw);

      /* Center the LATEST BID column text */
      justify-content: center;
      text-align: center;

      color: var(--gold-soft);
      border-left: 1px solid #555;
    }

    /* FOOTER – fixed inside the frame safe area, 3-column grid: QR | Sponsors | QR */
    .footer {
      position: fixed;
      left: var(--safe-horiz);
      right: var(--safe-horiz);
      /* Nudge up so outer frame remains visible */
      bottom: calc(var(--safe-bottom) + var(--footer-nudge-up));
      height: var(--footer-h);
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 2vw; /* space between QR and sponsors */
    }

    .footer-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 100%;
    }

    .qr-img {
      /* QR codes: large but contained entirely within the footer band */
      max-height: calc(var(--footer-h) * 0.90);
      background: rgba(255,255,255,0.98);
      padding: 0.4vh;
      border-radius: 0.3rem;
      box-shadow: 0 0 8px rgba(0,0,0,0.9);
      margin-bottom: 0; /* remove extra margin that could push into the table */
    }

    .footer-block span {
      font-size: clamp(0.8rem, 1vw, 1.2rem);
      font-weight: 700;
      color: #000000;
      letter-spacing: 0.05em;
      text-shadow: 0 0 3px rgba(255,255,255,0.7);
      text-transform: uppercase;
    }

    .footer-sponsors {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      pointer-events: none; /* avoids accidental focus */
    }

    .footer-sponsors img {
      /* Maximize sponsor image height without interfering with the table */
      max-height: calc(var(--footer-h) * 0.95);
      max-width: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 5px rgba(0,0,0,0.8));
    }

    /* ===== Closing Banner (true single line, centered, pulses while visible) ===== */
    #closing-banner {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);    /* center vertically & horizontally */
      z-index: 10000;
      display: none;                       /* JS will show/hide cyclically */
      padding: 0.6rem 1rem;
      box-sizing: border-box;

      /* One-line mechanics */
      display: inline-block;
      white-space: nowrap;                 /* no wrapping */
      width: auto;                         /* size to content */
      max-width: 96vw;                     /* stay within viewport */
      text-align: center;

      background: linear-gradient(180deg, rgba(255,0,0,0.92), rgba(200,0,0,0.92));
      border: 2px solid var(--gold);
      border-radius: 0.6rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);

      color: #fff;
      font-weight: 800;
      letter-spacing: 0.02em;
      /* If text approaches 96vw, font size steps down slightly instead of wrapping */
      font-size: clamp(18px, 3.2vw, 56px);
      text-transform: uppercase;

      pointer-events: none; /* TV-safe: no accidental focus/click */
    }

    /* Pulse animation (applied only while visible) */
    .banner-pulse {
      animation: cb-pulse 1.2s infinite alternate;
    }
    @keyframes cb-pulse {
      0%   { transform: translate(-50%, -50%) scale(1.00); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
      100% { transform: translate(-50%, -50%) scale(1.05); box-shadow: 0 14px 36px rgba(0,0,0,0.6); }
    }

    @media (prefers-reduced-motion: reduce) {
      .banner-pulse { animation: none; }
    }
  </style>
</head>

<body>

  <!-- Closing Banner (centered, one line, pulses while visible) -->
  <div id="closing-banner" aria-live="polite" aria-atomic="true" role="status">
    🚨 AUCTION CLOSING SOON — GET YOUR FINAL BIDS IN! 🚨
  </div>

  <div class="frame">
    <!-- HEADER -->
    <div class="header">
      <div class="header-title">The Starry Night Ball</div>
      <!-- Optional: Marymount Logo
      <img class="marymount-logo-top" src="Marymount Logo.png" alt="Marymount Logo" />
      -->
    </div>

    <!-- 2-COLUMN GRID -->
    <div class="items-grid">
      <div class="column" id="column-left"></div>
      <div class="column" id="column-right"></div>
    </div>
  </div>

  <!-- FOOTER – QR | SPONSORS | QR -->
  <div class="footer">
    <div class="footer-block">
      <img class="qr-img" src="2025 Marymount QR Code.jpeg" alt="QR Code to Bid (Left)" />
      <span>Scan QR code to bid</span>
    </div>

    <div class="footer-sponsors">
      <img src="Marymount Footer Sponsors.png" alt="Sponsors" />
    </div>

    <div class="footer-block">
      <img class="qr-img" src="2025 Marymount QR Code.jpeg" alt="QR Code to Bid (Right)" />
      <span>Scan QR code to bid</span>
    </div>
  </div>

  <script>
    /* =======================
       DATA + RENDERING LOGIC
       ======================= */
    const sheetID   = '1UdOW-OSvZUxlHEzPz0--FDtFcSMTjbZLDo-OhwRr_Mc';
    const sheetName = 'LEADING BIDS';
    // X=item, Y=new bid, Z=latest bid
    const range     = 'X5:Z43';   // show up to 38 rows (inclusive 5..43)

    const url =
      `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json` +
      `&sheet=${encodeURIComponent(sheetName)}&range=${range}`;

    const euroFmt = new Intl.NumberFormat('en-IE', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
    function formatEuro(v) {
      const n = Number(v);
      return Number.isFinite(n) ? `€${euroFmt.format(n)}` : '€0';
    }
    function formatNewBidCell(v) {
      if (v === null || v === undefined || v === '') return '';
      const n = Number(v);
      return Number.isFinite(n) ? `€${euroFmt.format(n)}` : String(v);
    }

    // Safe escaping (allowing <strong> wrapping from boldFirstSevenSafe)
    const escapeHtml = (s) => String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

    function boldFirstSevenSafe(t) {
      const safe = escapeHtml(t ?? '');
      return '<strong>' + safe.substring(0,7) + '</strong>' + safe.substring(7);
    }

    function applyAlignedRowHeights(totalRows, leftCount, rightCount) {
      const itemsGrid = document.querySelector('.items-grid');
      const leftCol   = document.getElementById('column-left');

      const gridRect   = itemsGrid.getBoundingClientRect();
      const availableH = gridRect.height;

      const gapStr = getComputedStyle(leftCol).gap || '0px';
      const gapPx  = parseFloat(gapStr.split(' ')[0]) || 0;

      const leftGaps  = Math.max(0, (leftCount  - 1)) * gapPx;
      const rightGaps = Math.max(0, (rightCount - 1)) * gapPx;

      const leftRowHRequired  = (availableH - leftGaps)  / Math.max(leftCount, 1);
      const rightRowHRequired = (availableH - rightGaps) / Math.max(rightCount, 1);
      const sharedRowH = Math.floor(Math.min(leftRowHRequired, rightRowHRequired));

      document.documentElement.style.setProperty('--rowH', sharedRowH + 'px');
      document.querySelector('.items-grid').style.opacity = 1;
    }

    function makeRow(r) {
      const item    = boldFirstSevenSafe((r[0] ?? '').toString());
      const newBidV = r[1];
      const newBid  = formatNewBidCell(newBidV);
      const latest  = formatEuro(r[2] ?? r[1]);

      const newBidSafe = escapeHtml(newBid);

      return `
        <div class="item-row">
          <div class="item-label">${item}</div>
          <div class="item-newbid">${newBidSafe}</div>
          <div class="item-amount">${latest}</div>
        </div>
      `;
    }

    function renderRows(rows) {
      const leftCol  = document.getElementById('column-left');
      const rightCol = document.getElementById('column-right');

      const half = Math.ceil(rows.length / 2);

      leftCol.innerHTML  = rows.slice(0, half).map(makeRow).join('');
      rightCol.innerHTML = rows.slice(half).map(makeRow).join('');

      const remeasure = () => applyAlignedRowHeights(rows.length, half, rows.length - half);
      (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve())
        .then(() => requestAnimationFrame(remeasure));
    }

    async function loadData() {
      try {
        const res  = await fetch(`${url}&cacheBust=${Date.now()}`, { cache: 'no-store' });
        const raw  = await res.text();

        // Robustly find the JSON block Google returns
        const start = raw.indexOf('{');
        const end   = raw.lastIndexOf('}');
        if (start === -1 || end === -1) throw new Error('Unexpected sheet response');

        const json = JSON.parse(raw.slice(start, end + 1));
        const rows = json.table.rows.map(r => r.c.map(c => (c ? c.v : '')));
        renderRows(rows);
      } catch (e) {
        console.error("Sheet load error", e);
        showDataError();
      }
    }

    // Initial load and periodic refresh
    loadData();
    const REFRESH_MS = 5000;
    setInterval(loadData, REFRESH_MS);

    // Re-apply heights on resize/orientation/fullscreen changes
    const reflow = () => {
      const leftCol    = document.getElementById('column-left');
      const rightCol   = document.getElementById('column-right');
      const leftCount  = leftCol.children.length;
      const rightCount = rightCol.children.length;
      if (leftCount || rightCount) {
        requestAnimationFrame(() =>
          applyAlignedRowHeights(leftCount + rightCount, leftCount, rightCount)
        );
      }
    };
    window.addEventListener('resize', reflow);
    window.addEventListener('orientationchange', reflow);
    document.addEventListener('fullscreenchange', reflow);

    function showDataError() {
      const leftCol  = document.getElementById('column-left');
      const rightCol = document.getElementById('column-right');
      leftCol.innerHTML  =
        `<div class="item-row">
           <div class="item-label"><strong>WAITING</strong> FOR BIDS…</div>
           <div class="item-newbid"></div>
           <div class="item-amount">€0</div>
         </div>`;
      rightCol.innerHTML = '';
      requestAnimationFrame(() => applyAlignedRowHeights(1, 1, 0));
      document.querySelector('.items-grid').style.opacity = 1;
    }

    /* =======================
       CLOSING BANNER LOGIC
       ======================= */

    // Helper: parse 'HH:mm' to Date today
    function getTodayDateFromHHMM(hhmm) {
      const [hh, mm] = (hhmm || '').split(':').map(Number);
      if (isNaN(hh) || isNaN(mm)) return null;
      const now = new Date();
      return new Date(now.getFullYear(), now.getMonth(), now.getDate(), hh, mm, 0, 0);
    }

    // Show/hide banner (centered element) + pulse class toggling
    function showClosingBanner() {
      const banner = document.getElementById('closing-banner');
      banner.style.display = 'inline-block';
      banner.classList.add('banner-pulse'); // start pulsing while visible
    }
    function hideClosingBanner() {
      const banner = document.getElementById('closing-banner');
      banner.style.display = 'none';
      banner.classList.remove('banner-pulse'); // stop pulsing while hidden
    }

    // Alternating ON/OFF cycle using chained timeouts (10s ON, 30s OFF)
    function startBannerFlashCycle(onMs, offMs) {
      let showing = true;
      const tick = () => {
        if (showing) {
          showClosingBanner();
          setTimeout(() => { showing = false; tick(); }, onMs);
        } else {
          hideClosingBanner();
          setTimeout(() => { showing = true; tick(); }, offMs);
        }
      };
      tick();
    }

    // === Closing banner config: default 20:15 today, optional URL override ===
    const BANNER_ON_MS   = 10 * 1000; // 10 seconds visible
    const BANNER_OFF_MS  = 30 * 1000; // 30 seconds hidden

    (function startOrScheduleClosingBanner() {
      const qp = new URLSearchParams(location.search);
      const paramTime = qp.get('banner');   // optional ?banner=HH:mm
      const fallback  = '20:15';            // hard-coded default for today

      const chosen = (paramTime && /^\d{2}:\d{2}$/.test(paramTime)) ? paramTime : fallback;
      const targetDate = getTodayDateFromHHMM(chosen);

      if (!targetDate) {
        console.warn('Invalid banner time; starting immediately.');
        startBannerFlashCycle(BANNER_ON_MS, BANNER_OFF_MS);
        return;
      }

      const delay = targetDate.getTime() - Date.now();
      if (delay <= 0) {
        // If time has already passed today, start immediately (today)
        startBannerFlashCycle(BANNER_ON_MS, BANNER_OFF_MS);
      } else {
        setTimeout(() => startBannerFlashCycle(BANNER_ON_MS, BANNER_OFF_MS), delay);
      }
    })();
   </script>

</body>
