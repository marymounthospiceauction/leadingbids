.stage{width:100vw;height:100vh;display:flex;}

/* LEFT PANEL */
.panel-left{width:var(--panel-split);height:100%;display:flex;flex-direction:column;border-right:1px solid var(--divider);}
.left-header{flex:0 0 auto;text-align:center;padding:1.2vh 2vw .4vh;}
.left-title{font-family:'Great Vibes',cursive;font-size:clamp(2rem,3.6vw,4.8rem);color:var(--text-dark);text-shadow:0 1px 0 rgba(255,220,100,.3),0 2px 8px rgba(0,0,0,.2);line-height:1;}
.left-sub{font-size:clamp(.45rem,.68vw,.78rem);font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:#3a2808;margin-top:.1vh;opacity:.75;}
.gold-rule{height:1px;flex:0 0 auto;margin:.3vh 2vw;background:linear-gradient(90deg,transparent,var(--champagne-dark),var(--champagne),var(--champagne-dark),transparent);opacity:.6;}
.carousel-viewport{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;transition:opacity .7s ease-in-out;pointer-events:none;}
.slide.active{opacity:1;pointer-events:auto;}
.slide-media{flex:0 0 52%;position:relative;overflow:hidden;background:#0a0602;}
.slide-media iframe{width:100%;height:100%;border:none;display:block;}
.slide-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:rgba(10,7,2,.55);}
.placeholder-name{font-family:'Great Vibes',cursive;font-size:clamp(2rem,4.5vw,6rem);color:var(--gold-bright);text-shadow:0 0 20px rgba(232,192,80,.7),0 2px 8px rgba(0,0,0,.8);text-align:center;padding:1em;max-width:90%;}
.slide-info{flex:1 1 auto;background:var(--panel);border-top:2px solid var(--champagne-dark);display:flex;flex-direction:column;padding:1.0vh 1.6vw .8vh;gap:.5vh;}
.slide-item-label{font-size:clamp(.65rem,1.1vw,1.3rem);font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--text-gold);}
.slide-item-desc{font-size:clamp(.55rem,.88vw,1rem);font-weight:500;color:rgba(245,237,216,.78);line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.slide-bid-row{display:flex;align-items:baseline;gap:.5vw;margin-top:auto;}
.slide-bid-label{font-size:clamp(.5rem,.72vw,.85rem);font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--text-dim);}
.slide-bid-amount{font-family:'Playfair Display',serif;font-size:clamp(1.4rem,3.2vw,4.5rem);font-weight:900;color:var(--text-gold);line-height:1;}
.slide-sponsor{display:flex;align-items:center;gap:.5vw;margin-top:.2vh;}
.sponsor-label{font-size:clamp(.45rem,.62vw,.72rem);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);opacity:.75;}
.sponsor-name{font-size:clamp(.5rem,.78vw,.92rem);font-weight:700;color:var(--text-gold);letter-spacing:.05em;}
.slide-progress{position:absolute;bottom:.6vh;left:50%;transform:translateX(-50%);display:flex;gap:.35vw;z-index:10;}
.progress-dot{width:clamp(4px,.55vw,9px);height:clamp(4px,.55vw,9px);border-radius:50%;background:rgba(200,160,48,.25);border:1px solid rgba(200,160,48,.45);transition:background .3s;}
.progress-dot.active{background:var(--gold-bright);}

/* RIGHT PANEL */
.panel-right{flex:1 1 auto;height:100%;display:flex;flex-direction:column;padding:1.2vh 1vw 1.2vh .8vw;background:rgba(10,7,2,.30);}
.sidebar-title{font-size:clamp(.5rem,.82vw,.92rem);font-weight:800;letter-spacing:.28em;text-transform:uppercase;color:var(--text-dark);text-align:center;padding-bottom:.4vh;border-bottom:1px solid var(--divider);margin-bottom:.5vh;}
.sidebar-list{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;}
.sb-row{display:grid;grid-template-columns:2.4ch 1fr auto;align-items:center;height:var(--sbRowH,34px);background:var(--panel-mid);border-left:2px solid var(--champagne-dark);overflow:hidden;box-shadow:0 1px 0 rgba(200,160,48,.12);}
.sb-row:nth-child(even){background:var(--panel-alt);}
.sb-row.is-hot{border-left-color:var(--hot-orange);}
.sb-row.is-sold{border-left-color:var(--sold-green);background:rgba(6,32,14,.88);}
.sb-row.is-current{border-left-color:var(--gold-bright);background:rgba(28,18,3,.92);}
.sb-num{font-size:clamp(7px,calc(var(--sbRowH,34px)*.25),13px);font-weight:800;color:var(--text-dim);text-align:center;padding-left:.3em;opacity:.75;}
.sb-label{font-size:clamp(7px,calc(var(--sbRowH,34px)*.27),13px);font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 .3vw;}
.sb-amount{font-family:'Playfair Display',serif;font-size:clamp(8px,calc(var(--sbRowH,34px)*.38),19px);font-weight:900;color:var(--text-gold);white-space:nowrap;padding-right:.4vw;}
.sb-amount.is-sold-amt{color:var(--sold-green);}
.sb-hot-icon{font-size:clamp(7px,calc(var(--sbRowH,34px)*.30),15px);margin-left:.2em;}
.sidebar-pager{display:flex;justify-content:center;gap:.35vw;padding-top:.4vh;flex:0 0 auto;}
.sb-dot{width:clamp(4px,.45vw,7px);height:clamp(4px,.45vw,7px);border-radius:50%;background:rgba(200,160,48,.22);border:1px solid rgba(200,160,48,.38);transition:background .3s;}
.sb-dot.active{background:var(--gold-bright);}
.sidebar-footer{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:.3vh;padding-top:.6vh;border-top:1px solid var(--divider);margin-top:.3vh;}
.qr-placeholder{height:clamp(36px,6.5vh,80px);aspect-ratio:1;background:rgba(255,255,255,.85);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;color:#888;border:1px solid #ccc;}
.sidebar-footer span{font-size:clamp(.4rem,.62vw,.72rem);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dark);opacity:.75;}
#status{position:fixed;top:.5vh;right:.5vw;font-size:.6rem;font-weight:700;color:#1a1008;background:rgba(255,240,180,.8);padding:2px 5px;border-radius:3px;z-index:999;}
</style>
</head>

const CAROUSEL_MS=20000,SIDEBAR_PAGE=10,SIDEBAR_MS=10000,REFRESH_MS=5000;
const euroFmt=new Intl.NumberFormat('en-IE',{minimumFractionDigits:0,maximumFractionDigits:0});
function fmtEuro(v){const n=Number(v);return(Number.isFinite(n)&&n>0)?'€'+euroFmt.format(n):'€0';}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function normKey(s){return String(s||'').toUpperCase().trim();}
function itemNum(l){const m=String(l||'').match(/[0-9]+/);return m?m[0].padStart(2,'0'):'';}
function splitLabel(raw){
  const s=String(raw||'').trim();
  const m=s.match(/^(ITEM\s*[0-9]+)\s*[-–]\s*(.+)$/i);
  return m?{prefix:m[1].toUpperCase(),name:m[2].toUpperCase()}:{prefix:'',name:s.toUpperCase()};
}
function ytId(url){
  if(!url)return null;
  const m=String(url).match(/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  return m?m[1]:null;
}
async function fetchSheet(sheet,range){
  const url='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:json&sheet='+encodeURIComponent(sheet)+'&range='+range+'&cb='+Date.now();
  const res=await fetch(url,{cache:'no-store'});
  const raw=await res.text();
  const s=raw.indexOf('{'),e=raw.lastIndexOf('}');
  const json=JSON.parse(raw.slice(s,e+1));
  return(json.table&&json.table.rows)?json.table.rows.map(r=>(r.c||[]).map(c=>c&&c.v!=null?c.v:'')):[];
}

let items=[],bidMap={},newBidMap={},carouselIdx=0,carouselTimer=null,sidebarPage=0,sidebarTimer=null,sidebarPages=1,firstLoad=true;

function parseSettings(rows){
  return rows.filter(r=>r[0]).map(r=>({
    label:String(r[0]||'').trim(),num:String(r[1]||'').trim(),desc:String(r[2]||'').trim(),
    isHot:/^(y|yes|true|1)$/i.test(String(r[4]||'')),
    videoUrl:String(r[8]||'').trim(),sponsorName:String(r[9]||'').trim(),isSold:false
  }));
}
function parseBids(rows){
  const bm={},nbm={};
  rows.forEach(r=>{const k=normKey(r[0]);if(!k)return;bm[k]=r[2]!==''?r[2]:r[1];nbm[k]=r[1];});
  return{bm,nbm};
}

function buildCarousel(){
  const vp=document.getElementById('carousel-viewport');
  const dots=document.getElementById('slide-progress');
  vp.innerHTML='';dots.innerHTML='';
  if(!items.length)return;
  items.forEach((item,idx)=>{
    const slide=document.createElement('div');
    slide.className='slide'+(idx===carouselIdx?' active':'');
    slide.id='slide-'+idx;
    const bid=bidMap[normKey(item.label)]||0;
    const{prefix,name}=splitLabel(item.label);
    const id=ytId(item.videoUrl);
    let mediaHtml;
    if(id){
      const src='https://www.youtube.com/embed/'+id+'?autoplay=1&mute=1&loop=1&controls=0&playlist='+id+'&rel=0';
      mediaHtml='<div class="slide-media"><iframe src="'+src+'" allow="autoplay; encrypted-media"></iframe></div>';
    }else{
      mediaHtml='<div class="slide-media"><div class="slide-placeholder"><div class="placeholder-name">'+esc(name)+'</div></div></div>';
    }
    const desc=item.desc?'<div class="slide-item-desc">'+esc(item.desc)+'</div>':'';
    const sponsor=item.sponsorName?'<div class="slide-sponsor"><span class="sponsor-label">Kindly sponsored by</span><span class="sponsor-name">'+esc(item.sponsorName)+'</span></div>':'';
    slide.innerHTML=mediaHtml+'<div class="slide-info"><div class="slide-item-label">'+esc(item.label)+'</div>'+desc+'<div class="slide-bid-row"><span class="slide-bid-label">Leading bid</span><span class="slide-bid-amount" id="bid-display-'+idx+'">'+fmtEuro(bid)+'</span></div>'+sponsor+'</div>';
    vp.appendChild(slide);
    const dot=document.createElement('div');
    dot.className='progress-dot'+(idx===carouselIdx?' active':'');
    dot.id='dot-'+idx;
    dots.appendChild(dot);
  });
}

function goToSlide(idx){
  if(!items.length)return;
  const prev=document.getElementById('slide-'+carouselIdx);
  const prevDot=document.getElementById('dot-'+carouselIdx);
  if(prev)prev.classList.remove('active');
  if(prevDot)prevDot.classList.remove('active');
  carouselIdx=(idx+items.length)%items.length;
  const next=document.getElementById('slide-'+carouselIdx);
  const nextDot=document.getElementById('dot-'+carouselIdx);
  if(next)next.classList.add('active');
  if(nextDot)nextDot.classList.add('active');
  highlightCurrent();
}

function startCarousel(){clearInterval(carouselTimer);carouselTimer=setInterval(()=>goToSlide(carouselIdx+1),CAROUSEL_MS);}

function applySbHeights(){
  const list=document.getElementById('sidebar-list');
  const rows=list.querySelectorAll('.sb-row');
  if(!rows.length)return;
  const availH=list.getBoundingClientRect().height;
  const rowH=Math.floor(Math.max(20,availH/rows.length));
  document.documentElement.style.setProperty('--sbRowH',rowH+'px');
}

function buildSidebarPage(){
  const list=document.getElementById('sidebar-list');
  const pager=document.getElementById('sidebar-pager');
  list.innerHTML='';pager.innerHTML='';
  const all=items.filter(it=>it.label);
  sidebarPages=Math.max(1,Math.ceil(all.length/SIDEBAR_PAGE));
  const page=all.slice(sidebarPage*SIDEBAR_PAGE,(sidebarPage+1)*SIDEBAR_PAGE);
  page.forEach(item=>{
    const row=document.createElement('div');
    const k=normKey(item.label);
    const bid=bidMap[k]||0;
    const yStr=normKey(newBidMap[k]||'');
    const isSold=item.isSold||yStr==='SOLD',isHot=item.isHot||yStr==='HOT';
    const isCurr=items.indexOf(item)===carouselIdx;
    row.className='sb-row'+(isSold?' is-sold':isHot?' is-hot':'')+(isCurr?' is-current':'');
    row.dataset.itemKey=k;
    const{name}=splitLabel(item.label);
    const hotIcon=isHot?'<span class="sb-hot-icon">&#x1F525;</span>':'';
    const amtCls='sb-amount'+(isSold?' is-sold-amt':'');
    row.innerHTML='<span class="sb-num">'+esc(itemNum(item.label))+'</span><span class="sb-label">'+esc(name)+hotIcon+'</span><span class="'+amtCls+'">'+(isSold?'SOLD':fmtEuro(bid))+'</span>';
    list.appendChild(row);
  });
  for(let i=0;i<sidebarPages;i++){const d=document.createElement('div');d.className='sb-dot'+(i===sidebarPage?' active':'');pager.appendChild(d);}
  requestAnimationFrame(applySbHeights);
}

function startSidebar(){clearInterval(sidebarTimer);sidebarTimer=setInterval(()=>{sidebarPage=(sidebarPage+1)%sidebarPages;buildSidebarPage();},SIDEBAR_MS);}

function highlightCurrent(){
  document.querySelectorAll('.sb-row').forEach(row=>{
    const item=items.find(it=>normKey(it.label)===row.dataset.itemKey);
    if(item)row.classList.toggle('is-current',items.indexOf(item)===carouselIdx);
  });
}

function updateBidDisplays(){
  items.forEach((item,idx)=>{
    const el=document.getElementById('bid-display-'+idx);
    if(!el)return;
    const k=normKey(item.label);
    el.textContent=fmtEuro(bidMap[k]||0);
  });
  document.querySelectorAll('.sb-row').forEach(row=>{
    const amtEl=row.querySelector('.sb-amount');
    if(!amtEl||amtEl.classList.contains('is-sold-amt'))return;
    amtEl.textContent=fmtEuro(bidMap[row.dataset.itemKey]||0);
  });
}

async function refresh(){
  try{
    const[settingsRows,bidRows]=await Promise.all([
      fetchSheet('SETTINGS','A2:L50'),
      fetchSheet('LEADING BIDS','X5:Z43')
    ]);
    const newItems=parseSettings(settingsRows);
    const{bm,nbm}=parseBids(bidRows);
    bidMap=bm;newBidMap=nbm;
    const changed=JSON.stringify(newItems.map(i=>i.label))!==JSON.stringify(items.map(i=>i.label));
    items=newItems;
    if(firstLoad||changed){buildCarousel();buildSidebarPage();startCarousel();startSidebar();firstLoad=false;}
    else{updateBidDisplays();highlightCurrent();}
    document.getElementById('status').textContent='Live '+new Date().toLocaleTimeString('en-IE');
  }catch(e){document.getElementById('status').textContent='Error: '+e.message;console.error(e);}
}
refresh();setInterval(refresh,REFRESH_MS);
window.addEventListener('resize',applySbHeights);
</script>
