<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #f7f7f7;
        font-family: Arial, sans-serif;
        color: #222;
      }

      .wrap {
        max-width: 480px;
        margin: 0 auto;
        padding: 16px;
      }

      .card {
        background: #fff;
        border-radius: 16px;
        padding: 20px 16px 24px;
        margin-top: 16px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      }

      .title {
        font-size: 26px;
        font-weight: 700;
        text-align: center;
        margin: 4px 0 8px;
      }

      .subtitle {
        text-align: center;
        font-size: 15px;
        line-height: 1.5;
        color: #555;
        margin: 0 0 20px;
      }

      .section {
        margin-bottom: 16px;
      }

      .label {
        display: block;
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 6px;
        color: #444;
        text-transform: uppercase;
        letter-spacing: 0.4px;
      }

      input[type="text"],
      input[type="email"],
      input[type="number"],
      select {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #ddd;
        border-radius: 12px;
        padding: 14px 12px;
        font-size: 16px;
        background: #fff;
      }

      input.readonly,
      select.readonly {
        background: #f4f4f4;
        color: #333;
      }

      .hint {
        font-size: 13px;
        color: #666;
        line-height: 1.4;
        margin-top: 6px;
      }

      .checkbox-row {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }

      .checkbox-row input {
        margin-top: 4px;
        transform: scale(1.2);
      }

      .btn {
        width: 100%;
        border: none;
        border-radius: 14px;
        padding: 16px;
        font-size: 18px;
        font-weight: 700;
        background: #000;
        color: #fff;
        cursor: pointer;
      }

      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .status {
        margin-top: 16px;
        padding: 14px;
        border-radius: 12px;
        font-size: 15px;
        line-height: 1.5;
        display: none;
      }

      .status.success {
        display: block;
        background: #eef9f0;
        color: #166534;
        border: 1px solid #b7e4c7;
      }

      .status.error {
        display: block;
        background: #fff1f2;
        color: #9f1239;
        border: 1px solid #fecdd3;
      }

      .footer-note {
        text-align: center;
        font-size: 12px;
        color: #777;
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="title">Place Your Bid</div>
        <p class="subtitle">Enter your bid details below.</p>

        <input type="hidden" id="token" value="<?= data.prefill.token ?>">
        <input type="hidden" id="mode" value="<?= data.prefill.mode ?>">
        <input type="hidden" id="itemNumber" value="<?= data.prefill.itemNumber ?>">

        <div class="section">
          <label class="label" for="item">Item</label>
          <select id="item"></select>
          <div class="hint" id="itemHint">
            Choose the item you would like to bid on.
          </div>
        </div>

        <div class="section">
          <label class="label" for="bidAmount">Bid Amount (€)</label>
          <input type="number" id="bidAmount" inputmode="numeric" min="1" step="1" placeholder="Enter your bid amount" />
        </div>

        <div class="section">
          <label class="label" for="yourName">Your Name</label>
          <input type="text" id="yourName" placeholder="Enter your name" />
        </div>

        <div class="section">
          <label class="label" for="mobileNumber">Mobile Number</label>
          <input type="text" id="mobileNumber" placeholder="Enter your mobile number" />
        </div>

        <div class="section">
          <label class="label" for="emailAddress">Email Address (Optional)</label>
          <input type="email" id="emailAddress" placeholder="Enter your email address" />
        </div>

        <div class="section">
          <label class="label" for="tableValue">Table Number or Table Name (Optional)</label>
          <input type="text" id="tableValue" placeholder="Enter your table number or table name" />
        </div>

        <div class="section">
          <label class="label">Consent</label>
          <div class="checkbox-row">
            <input type="checkbox" id="consentCheckbox" />
            <div>
              I agree to receive WhatsApp notifications regarding my bid.
              You will receive a notification to confirm your bid and a
              notification if you are outbid.
            </div>
          </div>
        </div>

        <button class="btn" id="submitBtn" onclick="submitBid()">Submit Bid</button>

        <div id="status" class="status"></div>

        <div class="footer-note">Marymount Ball Auction</div>
      </div>
    </div>

    <script>
      const ITEMS = <?= JSON.stringify(data.items) ?>;
      const PREFILL = <?= JSON.stringify(data.prefill) ?>;

      function initForm() {
        const itemSelect = document.getElementById("item");
        const itemNumberInput = document.getElementById("itemNumber");
        const yourName = document.getElementById("yourName");
        const mobileNumber = document.getElementById("mobileNumber");
        const emailAddress = document.getElementById("emailAddress");
        const tableValue = document.getElementById("tableValue");
        const consentCheckbox = document.getElementById("consentCheckbox");

        itemSelect.innerHTML = "";

        if (PREFILL.mode !== "token") {
          const emptyOption = document.createElement("option");
          emptyOption.value = "";
          emptyOption.textContent = "Select an item";
          itemSelect.appendChild(emptyOption);
        }

        ITEMS.forEach((row) => {
          const option = document.createElement("option");
          option.value = row.item;
          option.textContent = row.item;
          option.dataset.itemNumber = row.itemNumber;
          itemSelect.appendChild(option);
        });

        itemSelect.addEventListener("change", function () {
          const selected = itemSelect.options[itemSelect.selectedIndex];
          itemNumberInput.value = selected ? (selected.dataset.itemNumber || "") : "";
        });

        yourName.value = PREFILL.yourName || "";
        mobileNumber.value = PREFILL.mobileNumber || "";
        emailAddress.value = PREFILL.emailAddress || "";
        tableValue.value = PREFILL.tableValue || "";
        consentCheckbox.checked = (PREFILL.consent || "No") === "Yes";

        if (PREFILL.mode === "token") {
          itemSelect.value = PREFILL.item || "";
          itemNumberInput.value = PREFILL.itemNumber || "";

          itemSelect.disabled = true;
          itemSelect.classList.add("readonly");

          yourName.readOnly = true;
          yourName.classList.add("readonly");

          mobileNumber.readOnly = true;
          mobileNumber.classList.add("readonly");

          emailAddress.readOnly = true;
          emailAddress.classList.add("readonly");

          tableValue.readOnly = true;
          tableValue.classList.add("readonly");

          document.getElementById("itemHint").textContent =
            "This item has been prefilled from your bidding link.";
        }
      }

      function showStatus(message, type) {
        const status = document.getElementById("status");
        status.className = "status " + type;
        status.textContent = message;
      }

      function submitBid() {
        const submitBtn = document.getElementById("submitBtn");
        const itemSelect = document.getElementById("item");
        const itemNumber = document.getElementById("itemNumber").value.trim();
        const bidAmount = document.getElementById("bidAmount").value.trim();
        const yourName = document.getElementById("yourName").value.trim();
        const mobileNumber = document.getElementById("mobileNumber").value.trim();
        const emailAddress = document.getElementById("emailAddress").value.trim();
        const tableValue = document.getElementById("tableValue").value.trim();
        const consent = document.getElementById("consentCheckbox").checked ? "Yes" : "No";
        const token = document.getElementById("token").value.trim();

        document.getElementById("status").style.display = "none";

        submitBtn.disabled = true;
        submitBtn.textContent = "Submitting...";

        google.script.run
          .withSuccessHandler(function (result) {
            submitBtn.disabled = false;
            submitBtn.textContent = "Submit Bid";

            if (result && result.ok) {
              showStatus("Thank you. Your bid has been received.", "success");

              document.getElementById("bidAmount").value = "";

              if (document.getElementById("mode").value !== "token") {
                document.getElementById("yourName").value = "";
                document.getElementById("mobileNumber").value = "";
                document.getElementById("emailAddress").value = "";
                document.getElementById("tableValue").value = "";
                document.getElementById("consentCheckbox").checked = false;
                document.getElementById("item").selectedIndex = 0;
                document.getElementById("itemNumber").value = "";
              }
            } else {
              showStatus("Something went wrong while submitting your bid.", "error");
            }
          })
          .withFailureHandler(function (error) {
            submitBtn.disabled = false;
            submitBtn.textContent = "Submit Bid";
            showStatus(error.message || "Something went wrong while submitting your bid.", "error");
          })
          .submitWebBid({
            token: token,
            item: itemSelect.value,
            itemNumber: itemNumber,
            bidAmount: bidAmount,
            yourName: yourName,
            mobileNumber: mobileNumber,
            emailAddress: emailAddress,
            tableValue: tableValue,
            consent: consent
          });
      }

      initForm();
    </script>
  </body>
</html>
