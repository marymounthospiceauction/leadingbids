<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes, maximum-scale=5" />
  <title>Marymount Auction – Committee Admin</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: Calibri, Arial, sans-serif;
      background-color: #e6d4ad;
      min-height: 100%;
    }

    body { overflow-x: auto; }

    * { box-sizing: border-box; }

    /* ===== LOGIN SCREEN ===== */
    #loginScreen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #e6d4ad 0%, #f5e7c3 55%, #e6d4ad 100%);
      z-index: 9999;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.92);
      border-radius: 16px;
      padding: 26px 28px;
      width: 90%;
      max-width: 380px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      text-align: center;
    }

    .login-title {
      font-size: 1.5rem;
      margin-bottom: 6px;
      letter-spacing: 0.08em;
      font-weight: bold;
      text-transform: uppercase;
    }

    .login-subtitle {
      font-size: 0.9rem;
      margin-bottom: 18px;
    }

    .login-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 4px;
      text-align: left;
      font-weight: bold;
    }

    .login-input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #aaa;
      font-size: 1rem;
    }

    .login-button {
      width: 100%;
      padding: 12px;
      border: none;
      margin-top: 12px;
      border-radius: 999px;
      font-weight: bold;
      text-transform: uppercase;
      background: linear-gradient(135deg, #bc8b41, #e6ce91);
      cursor: pointer;
    }

    .login-error {
      margin-top: 6px;
      font-size: 0.8rem;
      color: red;
      min-height: 16px;
      text-align: left;
    }

    #protectedContent { display: none; }

    /* ===== HEADER IMAGE ===== */
    .header-image img {
      width: 100%;
      max-width: 600px;
      margin: 10px auto 20px auto;
      display: block;
    }

    /* ===== PAGE TITLE ===== */
    .page-title {
      text-align: center;
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 20px;
      letter-spacing: 0.05em;
    }

    /* ===== ITEM CARD ===== */
    .card-section {
      padding: 0 10px 20px;
    }

    .item-card {
      background: white;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
      border-left: 6px solid #bc8b41;
    }

    .item-header {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 12px;
      color: #111;
    }

    .item-subheader {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 16px;
      font-weight: 500;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 6px;
      color: #1b1b1b;
      letter-spacing: 0.05em;
    }

    .form-input {
      width: 100%;
      padding: 12px;
      border: 2px solid #d8c6a0;
      border-radius: 8px;
      font-size: 16px;
      background: #fffdf8;
      color: #111;
      outline: none;
      box-sizing: border-box;
    }

    .form-input:focus {
      border-color: #bc8b41;
      box-shadow: 0 0 0 3px rgba(195, 146, 67, 0.18);
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .two-col .form-group {
      margin-bottom: 0;
    }

    .whatsapp-confirm {
      background: #e6f4ea;
      border-left: 4px solid #27ae60;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      color: #1b5e20;
      margin-bottom: 14px;
      display: none;
    }

    .whatsapp-confirm.show {
      display: block;
    }

    .whatsapp-confirm strong {
      font-weight: bold;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px 18px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      background: #27ae60;
      color: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .btn:hover {
      background: #229954;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #bc8b41;
      margin-top: 8px;
    }

    .btn-secondary:hover {
      background: #a87933;
    }

    /* ===== ACTION LOG ===== */
    .action-log-section {
      padding: 0 10px 20px;
    }

    .action-log-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .action-log-container {
      background: white;
      border-radius: 8px;
      padding: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      max-height: 300px;
      overflow-y: auto;
      font-size: 0.85rem;
    }

    .action-log-entry {
      padding: 8px;
      border-bottom: 1px solid #f0f0f0;
      line-height: 1.4;
    }

    .action-log-entry:last-child {
      border-bottom: none;
    }

    .action-log-time {
      color: #999;
      font-size: 0.8rem;
    }

    .action-log-text {
      color: #333;
      font-weight: 500;
    }

    .error-message {
      background: #f8d7da;
      border-left: 4px solid #c0392b;
      padding: 12px;
      border-radius: 6px;
      color: #c0392b;
      margin-bottom: 14px;
      display: none;
      font-size: 0.9rem;
    }

    .error-message.show {
      display: block;
    }

    @media (max-width: 480px) {
      .two-col {
        grid-template-columns: 1fr;
      }

      .item-header {
        font-size: 1rem;
      }

      .page-title {
        font-size: 1.5rem;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div id="loginScreen">
    <div class="login-card">
      <div class="login-title">Committee Admin</div>
      <div class="login-subtitle">Enter the password to record sales.</div>

      <form id="loginForm">
        <label class="login-label">Password</label>
        <input type="password" id="passwordInput" class="login-input" required />
        <button class="login-button">Unlock</button>
        <div id="loginError" class="login-error"></div>
      </form>
    </div>
  </div>

  <!-- CONTENT -->
  <div id="protectedContent">

    <div class="header-image">
      <img src="Marymount%20Header.png" alt="Marymount Ball Auction">
    </div>

    <div class="page-title">COMMITTEE ADMIN PANEL</div>

    <div class="card-section">
      <div id="itemsContainer"></div>
    </div>

    <div class="action-log-section">
      <div class="action-log-title">Action Log — This Session</div>
      <div class="action-log-container" id="actionLogContainer">
        <div style="color: #999; padding: 12px; text-align: center;">No actions yet.</div>
      </div>
    </div>

  </div>

  <script>
    const PASSWORD = "Brendan2026";
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby1YsQ-4o26Krk7zWMn7hVuQLnvAVhTTygVo6nbqIKnExx0yGvQqsiyE1lr8mbWC7rnKg/exec";
    const LEADING_BIDS_SHEET = "1UdOW-OSvZUxlHEzPz0--FDtFcSMTjbZLDo-OhwRr_Mc";
    const LEADING_BIDS_RANGE = "R5:T43"; // item, new bid, leading bid

    let actionLog = [];

    document.getElementById("loginForm").addEventListener("submit", e => {
      e.preventDefault();
      if (document.getElementById("passwordInput").value === PASSWORD) {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("protectedContent").style.display = "block";
        loadLiveItems();
      } else {
        document.getElementById("loginError").textContent = "Incorrect password.";
      }
    });

    function loadLiveItems() {
      const url = 
        `https://docs.google.com/spreadsheets/d/${LEADING_BIDS_SHEET}/gviz/tq?tqx=out:json` +
        `&sheet=LEADING%20BIDS&range=${encodeURIComponent(LEADING_BIDS_RANGE)}`;

      fetch(url)
        .then(res => res.text())
        .then(text => {
          const json = JSON.parse(text.substr(47).slice(0, -2));
          const rows = json.table.rows.map(r => r.c.map(c => c?.v || ''));
          renderItems(rows);
        })
        .catch(err => {
          console.error("Sheet load error", err);
          document.getElementById("itemsContainer").innerHTML = 
            '<p style="color: red; padding: 20px;">Could not load items.</p>';
        });
    }

    function renderItems(rows) {
      const container = document.getElementById("itemsContainer");
      let html = '';

      rows.forEach((r, idx) => {
        const itemLabel = String(r[0] || '').trim();
        const leadBid = formatEuro(r[2]);

        if (!itemLabel) return;

        const itemNum = extractItemNumber(itemLabel);
        const itemName = extractItemName(itemLabel);

        html += `
          <div class="item-card">
            <div class="item-header">${itemLabel}</div>
            <div class="item-subheader">Lead Bid: ${leadBid}</div>

            <div id="error-${idx}" class="error-message"></div>

            <div class="form-group">
              <label class="form-label">Winner Name</label>
              <input type="text" class="form-input winner-name-${idx}" placeholder="Enter winner's name" />
            </div>

            <div class="form-group">
              <label class="form-label">Winner Mobile Number</label>
              <input type="tel" class="form-input winner-mobile-${idx}" placeholder="e.g. 0851234567 or 00441234567890" />
            </div>

            <div class="form-group">
              <label class="form-label">Sold Price (€)</label>
              <input type="tel" class="form-input sold-price-${idx}" placeholder="Enter price" inputmode="numeric" />
            </div>

            <div class="whatsapp-confirm" id="whatsapp-${idx}">
              <strong>✓ WhatsApp winner notification will be sent</strong> to the mobile number above.
            </div>

            <button class="btn" onclick="recordSale(${idx}, '${itemNum}', '${itemName}')">
              Record Sale
            </button>
          </div>
        `;
      });

      container.innerHTML = html;

      // Show WhatsApp confirmation when mobile is entered
      document.querySelectorAll('.form-input[class*="winner-mobile"]').forEach((input, idx) => {
        input.addEventListener('input', () => {
          const mobile = input.value.trim();
          const confirmDiv = document.getElementById(`whatsapp-${idx}`);
          if (mobile) {
            confirmDiv.classList.add('show');
          } else {
            confirmDiv.classList.remove('show');
          }
        });
      });
    }

    function extractItemNumber(label) {
      const match = label.match(/ITEM\s*(\d+)/i);
      return match ? match[1] : '';
    }

    function extractItemName(label) {
      return label.replace(/^ITEM\s*\d+\s*-?\s*/i, '').trim();
    }

    function formatEuro(value) {
      if (!value || isNaN(value)) return '€0';
      return '€' + Number(value).toLocaleString('en-IE');
    }

    function recordSale(idx, itemNum, itemName) {
      const winnerName = document.querySelector(`.winner-name-${idx}`).value.trim();
      const winnerMobile = document.querySelector(`.winner-mobile-${idx}`).value.trim();
      const soldPrice = document.querySelector(`.sold-price-${idx}`).value.trim();
      const errorDiv = document.getElementById(`error-${idx}`);

      // Clear errors
      errorDiv.classList.remove('show');
      errorDiv.textContent = '';

      // Validate
      if (!winnerName) {
        showError(errorDiv, 'Please enter the winner\'s name.');
        return;
      }

      if (!winnerMobile) {
        showError(errorDiv, 'Please enter the winner\'s mobile number.');
        return;
      }

      if (!soldPrice || isNaN(soldPrice)) {
        showError(errorDiv, 'Please enter a valid sold price.');
        return;
      }

      if (Number(soldPrice) <= 0) {
        showError(errorDiv, 'Sold price must be greater than 0.');
        return;
      }

      // Send to backend
      recordSaleToBackend(itemNum, itemName, winnerName, winnerMobile, soldPrice, errorDiv, idx);
    }

    function recordSaleToBackend(itemNum, itemName, winnerName, winnerMobile, soldPrice, errorDiv, idx) {
      const payload = {
        action: 'markItemSold',
        itemNumber: itemNum,
        itemName: itemName,
        winnerName: winnerName,
        winnerMobile: winnerMobile,
        soldPrice: soldPrice
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
        .then(res => res.text())
        .then(text => {
          const json = JSON.parse(text);
          if (json.ok) {
            addLogEntry(`✓ ${itemName} sold to ${winnerName} for €${Number(soldPrice).toLocaleString('en-IE')}`);
            document.querySelector(`.winner-name-${idx}`).value = '';
            document.querySelector(`.winner-mobile-${idx}`).value = '';
            document.querySelector(`.sold-price-${idx}`).value = '';
            document.getElementById(`whatsapp-${idx}`).classList.remove('show');
          } else {
            showError(errorDiv, json.message || 'Failed to record sale.');
          }
        })
        .catch(err => {
          showError(errorDiv, 'Error: ' + (err.message || 'Network error'));
        });
    }

    function showError(div, message) {
      div.textContent = message;
      div.classList.add('show');
    }

    function addLogEntry(text) {
      const time = new Date().toLocaleTimeString('en-IE');
      actionLog.unshift({ time, text });

      const container = document.getElementById('actionLogContainer');
      container.innerHTML = actionLog.map((entry, i) => `
        <div class="action-log-entry">
          <div class="action-log-time">${entry.time}</div>
          <div class="action-log-text">${entry.text}</div>
        </div>
      `).join('');
    }
  </script>

</body>
</html>
