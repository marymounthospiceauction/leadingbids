<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes, maximum-scale=5" />
  <title>Marymount Auction – Committee View</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: Calibri, Arial, sans-serif;
      background-color: #e6d4ad;
      min-height: 100%;
    }

    body { overflow-x: auto; }

    * { box-sizing: border-box; }

    /* ===== LOGIN SCREEN ===== */
    #loginScreen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #e6d4ad 0%, #f5e7c3 55%, #e6d4ad 100%);
      z-index: 9999;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.92);
      border-radius: 16px;
      padding: 26px 28px;
      width: 90%;
      max-width: 380px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      text-align: center;
    }

    .login-title {
      font-size: 1.5rem;
      margin-bottom: 6px;
      letter-spacing: 0.08em;
      font-weight: bold;
      text-transform: uppercase;
    }

    .login-subtitle {
      font-size: 0.9rem;
      margin-bottom: 18px;
    }

    .login-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 4px;
      text-align: left;
      font-weight: bold;
    }

    .login-input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #aaa;
      font-size: 1rem;
    }

    .login-button {
      width: 100%;
      padding: 12px;
      border: none;
      margin-top: 12px;
      border-radius: 999px;
      font-weight: bold;
      text-transform: uppercase;
      background: linear-gradient(135deg, #bc8b41, #e6ce91);
      cursor: pointer;
    }

    .login-error {
      margin-top: 6px;
      font-size: 0.8rem;
      color: red;
      min-height: 16px;
      text-align: left;
    }

    #protectedContent { display: none; }

    /* ===== HEADER IMAGE ===== */
    .header-image img {
      width: 100%;
      max-width: 600px;
      margin: 10px auto 20px auto;
      display: block;
    }

    /* ===== BUTTON ===== */
    .button-section {
      display: flex;
      justify-content: center;
      padding: 20px 0;
    }

    .custom-button {
      width: 100%;
      max-width: 280px;
      padding: 10px 16px;
      background: #bc8b41;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
      color: black;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    /* ===== SUMMARY BAR ===== */
    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      padding: 0 5px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .auction-total-label {
      font-size: 0.85rem;
      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: 0.06em;
    }

    .auction-total-value {
      font-size: 1.6rem;
      font-weight: bold;
    }

    .status-summary-wrapper {
      min-width: 160px;
      text-align: right;
    }

    .status-summary-title {
      font-size: 0.85rem;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .status-summary-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 8px;
      align-items: center;
      margin-bottom: 2px;
    }

    .status-summary-label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
    }

    .status-summary-count {
      font-size: 0.8rem;
      font-weight: bold;
      text-align: right;
    }

    .status-colour-box {
      width: 13px;
      height: 13px;
      border-radius: 3px;
      border: 1px solid #333;
    }

    .status-colour-below { background:#f8d7da; }
    .status-colour-on-target { background:#fff3cd; }
    .status-colour-above { background:#d4edda; }

    /* ===== TABLE ===== */
    .table-section { padding: 15px; width: 100%; }

    .table-heading {
      text-align: center;
      font-size: 1.4rem;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .table-container {
      background:white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed; /* predictable column widths */
    }

    thead th {
      background:black;
      color:#bc8b41;
      padding:8px;
      border:1px solid #ddd;
      font-size:0.8rem;
      text-transform:uppercase;
      white-space:nowrap;
    }

    tbody td {
      border:1px solid #ccc;
      padding:6px;
      white-space:nowrap;
      font-size:0.8rem;
    }

    .status-below { background:#f8d7da; }
    .status-on-target { background:#fff3cd; }
    .status-above { background:#d4edda; }

    .lowhigh-bg {
      background:#f1f1f1 !important;
    }

    .narrow-col {
      max-width:150px;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    /* STATUS + LEADING BID + ITEM column sizing */
    .col-status {
      width: 40px;
      max-width: 40px;
    }

    .col-leading {
      width: 80px;
      max-width: 80px;
    }

    .col-item {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* On small screens, force ITEM to take the remaining width so first 3 fit */
    @media (max-width: 600px) {
      .col-item {
        max-width: calc(100vw - 120px); /* 40 (status) + 80 (leading) */
      }
    }

    /* Alternating row colour – subtle gold, preserving STATUS cell colours */
    tbody tr.alt-gold td:not(.status-below):not(.status-on-target):not(.status-above) {
      background-color: #f5ebd0;
    }

    /* STATUS icons unified */
    .status-icon {
      font-size: 1.1em;
      display: inline-block;
      width: 1em;
      line-height: 1;
      text-align: center;
    }

    .status-icon-below  { color:#c0392b; } /* red down */
    .status-icon-target { color:#e67e22; } /* orange right */
    .status-icon-above  { color:#27ae60; } /* green up */
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div id="loginScreen">
    <div class="login-card">
      <div class="login-title">Committee Login</div>
      <div class="login-subtitle">Enter the password to view the dashboard.</div>

      <form id="loginForm">
        <label class="login-label">Password</label>
        <input type="password" id="passwordInput" class="login-input" required />
        <button class="login-button">Unlock</button>
        <div id="loginError" class="login-error"></div>
      </form>
    </div>
  </div>

  <!-- CONTENT -->
  <div id="protectedContent">

    <div class="header-image">
      <img src="LiveHeader.png" alt="Marymount Header">
    </div>

    <div class="button-section">
      <a class="custom-button"
        href="https://docs.google.com/forms/d/e/1FAIpQLSf7DrJwXkG6gFfN_8JWCpyFt04tEsA5kFhpPHjRHSJx4C37rg/viewform"
        target="_blank">📝 Place an Auction Bid</a>
    </div>

    <div class="table-section">

      <!-- SUMMARY -->
      <div class="summary-row">
        <div>
          <div class="auction-total-label">AUCTION TOTAL</div>
          <div class="auction-total-value" id="auctionTotal">€0</div>
        </div>

        <div class="status-summary-wrapper">
          <div class="status-summary-title">STATUS SUMMARY</div>

          <div class="status-summary-row">
            <div class="status-summary-label">
              <span class="status-colour-box status-colour-below"></span> BELOW
            </div>
            <div class="status-summary-count" id="countBelow">0</div>
          </div>

          <div class="status-summary-row">
            <div class="status-summary-label">
              <span class="status-colour-box status-colour-on-target"></span> ON TARGET
            </div>
            <div class="status-summary-count" id="countOnTarget">0</div>
          </div>

          <div class="status-summary-row">
            <div class="status-summary-label">
              <span class="status-colour-box status-colour-above"></span> ABOVE
            </div>
            <div class="status-summary-count" id="countAbove">0</div>
          </div>
        </div>
      </div>

      <!-- COMMITTEE VIEW TITLE -->
      <div class="table-heading">COMMITTEE VIEW</div>

      <div class="table-container">
        <table id="bidsTable">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>

    </div>
  </div>

  <script>
    const PASSWORD = "starrynight";

    /* ===== LOGIN ===== */
    document.getElementById("loginForm").addEventListener("submit", e => {
      e.preventDefault();
      if (document.getElementById("passwordInput").value === PASSWORD) {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("protectedContent").style.display = "block";
        startData();
      } else {
        document.getElementById("loginError").textContent = "Incorrect password.";
      }
    });

    /* ===== DATA CONFIG ===== */
    const sheetID   = "1DKnonV1mO-irLiJ4b9M62XYOMEf3LqRvJtEvopvjAp0";
    const sheetName = "LIVE STATUS";
    const range     = "A5:L44";

    const url =
      `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}&range=${range}`;

    const hiddenColumns = [
      "EMAIL ADDRESS", "CONTACT NUMBER", "TABLE NUMBER/NAME", "BID TIME"
    ].map(h => h.toUpperCase().trim());

    const currencyColumns = [
      "LOW", "HIGH", "CURRENT BID", "COMMITTEE BID", "PUBLIC BID",
      "TARGET", "RESERVE", "VALUE"
    ].map(h => h.toUpperCase().trim());

    const centerColumns = [
      "LOW",
      "HIGH",
      "JOINT TOP BID",
      "CURRENT BID",
      "STATUS",
      "NUMBER OF BIDS"
    ].map(h => h.toUpperCase().trim());

    /* Only ITEM DESCRIPTION is narrow now – ITEM can expand */
    const narrowColumns = ["ITEM DESCRIPTION"].map(h => h.toUpperCase().trim());

    const hiddenSet   = new Set(hiddenColumns);
    const currencySet = new Set(currencyColumns);
    const centerSet   = new Set(centerColumns);
    const narrowSet   = new Set(narrowColumns);

    function formatEuro(v) {
      if (!v) return "";
      const n = Number(String(v).replace(/[^\d.-]/g, ""));
      if (isNaN(n)) return v;
      return "€" + n.toLocaleString("en-IE", { minimumFractionDigits: 0, maximumFractionDigits: 0 });
    }

    // Normalise an item label to its ITEM number (e.g. "ITEM 04"),
    // so ITEM 04 SET 1 / SET 2 / SET 3 all group together.
    function normalizeItemKey(value, fallback) {
      if (value == null) return String(fallback);
      const str = String(value).trim();
      const m = str.match(/ITEM\s*\d+/i);
      return (m ? m[0] : str).toUpperCase();
    }

    async function loadData() {
      const res = await fetch(url);
      const raw = await res.text();
      const json = JSON.parse(raw.substr(47).slice(0, -2));

      const cols = json.table.cols.map(c => c.label || "");
      const rows = json.table.rows.map(r => r.c.map(c => c?.v || ""));

      const thead = document.querySelector("#bidsTable thead");
      const tbody = document.querySelector("#bidsTable tbody");

      /* Determine visible columns */
      let visible = [];
      cols.forEach((lbl, i) => {
        const key = (lbl || "").toUpperCase().trim();
        if (!hiddenSet.has(key)) visible.push(i);
      });

      const statusIndex = cols.findIndex(c => (c || "").toUpperCase().trim() === "STATUS");
      const bidIndex    = cols.findIndex(c => (c || "").toUpperCase().trim() === "CURRENT BID");
      const bidsIndex   = cols.findIndex(c => (c || "").toUpperCase().trim() === "NUMBER OF BIDS");
      const itemIndex   = cols.findIndex(c => (c || "").toUpperCase().trim() === "ITEM");

      /* STATUS first */
      if (statusIndex > -1) {
        visible = visible.filter(v => v !== statusIndex);
        visible.unshift(statusIndex);
      }

      /* BIDS as 4th column */
      if (bidsIndex > -1) {
        visible = visible.filter(v => v !== bidsIndex);
        visible.splice(3, 0, bidsIndex);
      }

      /* ===== HEADER ===== */
      let h = "<tr>";
      visible.forEach(i => {
        const rawLabel = cols[i] || "";
        const key = rawLabel.toUpperCase().trim();
        let label = rawLabel;

        if (key.includes("LOW"))  label = "LOW TARGET";
        if (key.includes("HIGH")) label = "HIGH TARGET";
        if (key === "CURRENT BID")     label = "LEADING BID";
        if (key === "NUMBER OF BIDS")  label = "BIDS";
        if (key === "NAME")            label = "WINNER NAME";

        const thKey = key;
        let clsArr  = [];

        if (narrowSet.has(thKey)) clsArr.push("narrow-col");
        if (thKey === "STATUS")       clsArr.push("col-status");
        if (thKey === "CURRENT BID")  clsArr.push("col-leading");
        if (thKey === "ITEM")         clsArr.push("col-item");

        const style = (centerSet.has(thKey) || key.includes("LOW") || key.includes("HIGH"))
          ? "text-align:center;" : "";

        h += `<th class="${clsArr.join(" ")}" style="${style}">${label}</th>`;
      });
      h += "</tr>";
      thead.innerHTML = h;

      /* ===== AUCTION TOTAL + STATUS COUNTS (per normalised ITEM, highest bid) ===== */
      let auctionTotal = 0;
      const itemBest = new Map(); // normalizedItemKey -> { bid, status }

      rows.forEach((row, rowIndex) => {
        // Auction total: sum of all CURRENT BID values (all rows)
        if (bidIndex > -1) {
          const bidNum = Number(String(row[bidIndex] ?? "").replace(/[^\d.-]/g, ""));
          if (!isNaN(bidNum)) auctionTotal += bidNum;
        }

        const itemKey = (itemIndex !== -1)
          ? normalizeItemKey(row[itemIndex], rowIndex)
          : String(rowIndex);

        const statusKey = (statusIndex !== -1)
          ? String(row[statusIndex] ?? "").toUpperCase().trim()
          : "";

        const bidNum = (bidIndex !== -1)
          ? Number(String(row[bidIndex] ?? "").replace(/[^\d.-]/g, ""))
          : NaN;

        const existing = itemBest.get(itemKey);
        if (!existing || (!isNaN(bidNum) && bidNum > existing.bid)) {
          itemBest.set(itemKey, { bid: bidNum, status: statusKey });
        }
      });

      const statusCounts = { 'BELOW': 0, 'ON TARGET': 0, 'ABOVE': 0 };
      for (const { status } of itemBest.values()) {
        if (statusCounts[status] !== undefined) {
          statusCounts[status]++;
        }
      }

      document.getElementById("auctionTotal").textContent = formatEuro(auctionTotal);
      document.getElementById("countBelow").textContent   = statusCounts["BELOW"];
      document.getElementById("countOnTarget").textContent = statusCounts["ON TARGET"];
      document.getElementById("countAbove").textContent   = statusCounts["ABOVE"];

      /* ===== BODY WITH ALTERNATING GOLD ROWS (grouped by normalised ITEM) ===== */
      let bodyHTML = "";
      let lastItemKey = null;
      let stripeToggle = 0; // 0/1 for alternation

      rows.forEach((row, rowIndex) => {
        const itemKey = (itemIndex !== -1)
          ? normalizeItemKey(row[itemIndex], rowIndex)
          : String(rowIndex);

        // Only change stripe when itemKey changes
        if (itemKey !== lastItemKey) {
          stripeToggle = 1 - stripeToggle;
          lastItemKey = itemKey;
        }
        const rowClass = stripeToggle === 1 ? "alt-gold" : "";

        bodyHTML += `<tr class="${rowClass}">`;

        visible.forEach(i => {
          const rawLabel = cols[i] || "";
          const key = rawLabel.toUpperCase().trim();
          let v = row[i];

          // Currency formatting, including LOW/HIGH (targets)
          if (currencySet.has(key) || key.includes("LOW") || key.includes("HIGH")) {
            v = formatEuro(v);
          }

          let classes = [];

          // Status colouring
          if (i === statusIndex) {
            const s = String(row[i] || "").toUpperCase().trim();
            if (s === "BELOW")      classes.push("status-below");
            else if (s === "ABOVE") classes.push("status-above");
            else if (s === "ON TARGET") classes.push("status-on-target");
          }

          if (key.includes("LOW") || key.includes("HIGH")) {
            classes.push("lowhigh-bg");
          }

          if (narrowSet.has(key)) {
            classes.push("narrow-col");
          }

          if (key === "STATUS")       classes.push("col-status");
          if (key === "CURRENT BID")  classes.push("col-leading");
          if (key === "ITEM")         classes.push("col-item");

          let style = "";
          if (centerSet.has(key) || key.includes("LOW") || key.includes("HIGH")) {
            style += "text-align:center;";
          }
          if (key === "CURRENT BID") {
            style += "font-weight:bold;";
          }

          // STATUS icons instead of text, with colours:
          // red down ↓ for BELOW, orange right → for ON TARGET, green up ↑ for ABOVE
          let displayVal = v;
          if (i === statusIndex) {
            const s = String(row[i] || "").toUpperCase().trim();
            if (s === "BELOW") {
              displayVal = '<span class="status-icon status-icon-below">⬇</span>';
            } else if (s === "ABOVE") {
              displayVal = '<span class="status-icon status-icon-above">⬆</span>';
            } else if (s === "ON TARGET") {
              displayVal = '<span class="status-icon status-icon-target">➜</span>';
            }
          }

          bodyHTML += `<td class="${classes.join(" ")}" style="${style}">${displayVal ?? ""}</td>`;
        });

        bodyHTML += "</tr>";
      });

      tbody.innerHTML = bodyHTML;
    }

    function startData() {
      loadData();
      setInterval(loadData, 5000);
    }
  </script>

</body>
</html>
