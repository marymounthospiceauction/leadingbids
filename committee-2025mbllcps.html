<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes, maximum-scale=5" />
  <title>Marymount Auction – Committee View</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: Calibri, Arial, sans-serif;
      background-color: #e6d4ad;
    }

    body { overflow-x: auto; }

    * { box-sizing: border-box; }

    /* LOGIN SCREEN */
    #loginScreen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #e6d4ad 0%, #f5e7c3 55%, #e6d4ad 100%);
      z-index: 9999;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 16px;
      padding: 26px 28px;
      max-width: 380px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      text-align: center;
    }

    .login-title {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .login-input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #aaa;
    }

    .login-button {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      border-radius: 999px;
      background: linear-gradient(135deg, #bc8b41, #e6ce91);
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    #protectedContent { display: none; }

    /* HEADER IMAGE */
    .header-image img {
      width: 100%;
      max-width: 600px;
      margin: 10px auto 20px auto;
      display: block;
    }

    /* BUTTON */
    .custom-button {
      max-width: 320px;
      padding: 10px 16px;
      background: #bc8b41;
      border-radius: 8px;
      text-align: center;
      color: black;
      font-weight: bold;
      display: block;
      margin: 0 auto;
    }

    @media(max-width:480px) {
      .custom-button { max-width: 260px; }
    }

    /* TABLE */
    .table-heading {
      text-align: center;
      font-size: 1.6rem;
      font-weight: bold;
    }

    .table-container {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      overflow-x: auto;
      margin-top: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead th {
      background: black;
      color: #bc8b41;
      padding: 8px;
      border: 1px solid #ddd;
      text-transform: uppercase;
      white-space: nowrap;
    }

    tbody td {
      border: 1px solid #ccc;
      padding: 6px;
      white-space: nowrap;
    }

    .status-below { background:#f8d7da; }
    .status-on-target { background:#fff3cd; }
    .status-above { background:#d4edda; }

    /* Light grey for LOW & HIGH TARGET */
    .lowhigh-bg {
      background:#f1f1f1 !important;
    }

    /* STATUS SUMMARY */
    .summary-row {
      display:flex;
      justify-content:space-between;
      margin-bottom:12px;
      flex-wrap:wrap;
    }

    .status-summary-wrapper {
      min-width:170px;
      text-align:right;
    }

    .status-summary-row {
      display:grid;
      grid-template-columns:1fr auto;
      gap:3px 6px;
      align-items:center;
    }

    .status-summary-label {
      display:flex;
      align-items:center;
      gap:4px;
    }

    .status-colour-box {
      width:12px; height:12px;
      border-radius:3px;
      border:1px solid #333;
    }

    .status-colour-below { background:#f8d7da; }
    .status-colour-on-target { background:#fff3cd; }
    .status-colour-above { background:#d4edda; }

    .narrow-col {
      max-width:150px;
      overflow:hidden;
      text-overflow:ellipsis;
    }
  </style>
</head>

<body>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen">
    <div class="login-card">
      <div class="login-title">Committee Login</div>
      <form id="loginForm">
        <input type="password" id="passwordInput" class="login-input" placeholder="Password" required />
        <button type="submit" class="login-button">Unlock</button>
        <div id="loginError" style="color:red;font-size:0.8rem;margin-top:6px;"></div>
      </form>
    </div>
  </div>

  <!-- PROTECTED CONTENT -->
  <div id="protectedContent">

    <div class="header-image">
      <img src="LiveHeader.png" alt="Marymount Header">
    </div>

    <a class="custom-button"
      href="https://docs.google.com/forms/d/e/1FAIpQLSf7DrJwXkG6gFfN_8JWCpyFt04tEsA5kFhpPHjRHSJx4C37rg/viewform"
      target="_blank">📝 Place an Auction Bid</a>

    <div class="table-section">

      <div class="summary-row">
        <div>
          <div class="auction-total-label">Auction Total</div>
          <div class="auction-total-value" id="auctionTotal">€0</div>
        </div>

        <div class="status-summary-wrapper">
          <div class="status-summary-title">Status Summary</div>

          <div class="status-summary-row">
            <div class="status-summary-label">
              <span class="status-colour-box status-colour-below"></span> BELOW
            </div>
            <div id="countBelow">0</div>
          </div>

          <div class="status-summary-row">
            <div class="status-summary-label">
              <span class="status-colour-box status-colour-on-target"></span> ON TARGET
            </div>
            <div id="countOnTarget">0</div>
          </div>

          <div class="status-summary-row">
            <div class="status-summary-label">
              <span class="status-colour-box status-colour-above"></span> ABOVE
            </div>
            <div id="countAbove">0</div>
          </div>

        </div>
      </div>

      <div class="table-heading">COMMITTEE VIEW</div>

      <div class="table-container">
        <table id="bidsTable">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const PASSWORD = "starrynight";

    function showProtectedContent() {
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("protectedContent").style.display = "block";
      startData();
    }

    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      if (document.getElementById("passwordInput").value.trim() === PASSWORD) {
        showProtectedContent();
      } else {
        document.getElementById("loginError").textContent = "Incorrect password.";
      }
    });

    /* ===== DATA LOADING ===== */
    const sheetID = "1DKnonV1mO-irLiJ4b9M62XYOMEf3LqRvJtEvopvjAp0";
    const sheetName = "LIVE STATUS";
    const range = "A5:L44";

    const url =
      `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}&range=${range}`;

    const hiddenColumns = [
      "EMAIL ADDRESS", "CONTACT NUMBER", "TABLE NUMBER/NAME", "BID TIME"
    ];

    const currencyColumns = [
      "LOW", "HIGH", "CURRENT BID", "COMMITTEE BID", "PUBLIC BID", "TARGET", "RESERVE", "VALUE"
    ];

    const centerColumns = [
      "LOW", "HIGH", "CURRENT BID", "STATUS", "NUMBER OF BIDS", "JOINT HIGHEST BID"
    ];

    const narrowColumns = ["ITEM", "ITEM DESCRIPTION"];

    const currencySet = new Set(currencyColumns);
    const centerSet = new Set(centerColumns);
    const narrowSet = new Set(narrowColumns);

    function isHidden(label) {
      return hiddenColumns.includes(label.toUpperCase());
    }

    function formatEuro(v) {
      if (!v) return "";
      const num = Number(String(v).replace(/[^\d.-]/g, ""));
      if (isNaN(num)) return v;
      return "€" + num.toLocaleString("en-IE", {
        minimumFractionDigits: 0,
        maximumFractionDigits: 0
      });
    }

    async function loadData() {
      const res = await fetch(url);
      const raw = await res.text();
      const json = JSON.parse(raw.substr(47).slice(0, -2));

      const cols = json.table.cols.map(c => c.label || "");
      const rows = json.table.rows.map(r => r.c.map(c => c?.v || ""));

      const thead = document.querySelector("#bidsTable thead");
      const tbody = document.querySelector("#bidsTable tbody");

      let visible = [];
      cols.forEach((lbl, i) => { if (!isHidden(lbl)) visible.push(i); });

      const statusIndex = cols.findIndex(c => c.toUpperCase() === "STATUS");
      const bidIndex = cols.findIndex(c => c.toUpperCase() === "CURRENT BID");
      const bidsIndex = cols.findIndex(c => c.toUpperCase() === "NUMBER OF BIDS");

      /* STATUS FIRST */
      if (statusIndex > -1) {
        visible = visible.filter(v => v !== statusIndex);
        visible.unshift(statusIndex);
      }

      /* BIDS as 4th column */
      if (bidsIndex > -1) {
        visible = visible.filter(v => v !== bidsIndex);
        visible.splice(3, 0, bidsIndex);
      }

      /* ===== HEADER ===== */
      let headerHTML = "<tr>";
      visible.forEach(i => {
        let label = cols[i];
        const key = label.toUpperCase();

        if (key.includes("LOW")) label = "LOW TARGET";
        if (key.includes("HIGH")) label = "HIGH TARGET";
        if (key === "CURRENT BID") label = "LEADING BID";
        if (key === "NUMBER OF BIDS") label = "BIDS";
        if (key === "NAME") label = "WINNER NAME";

        const cls = narrowSet.has(label) ? "narrow-col" : "";
        const align = centerSet.has(key) ? "text-align:center;" : "";

        headerHTML += `<th class="${cls}" style="${align}">${label}</th>`;
      });
      headerHTML += "</tr>";
      thead.innerHTML = headerHTML;

      /* ===== TOTALS ===== */
      let total = 0;
      let statusCounts = { BELOW: 0, "ON TARGET": 0, ABOVE: 0 };

      rows.forEach(r => {
        const val = Number(String(r[bidIndex]).replace(/[^\d.-]/g, ""));
        if (!isNaN(val)) total += val;

        const s = String(r[statusIndex]).toUpperCase();
        if (statusCounts[s] !== undefined) statusCounts[s]++;
      });

      document.getElementById("auctionTotal").textContent = formatEuro(total);
      document.getElementById("countBelow").textContent = statusCounts["BELOW"];
      document.getElementById("countOnTarget").textContent = statusCounts["ON TARGET"];
      document.getElementById("countAbove").textContent = statusCounts["ABOVE"];

      /* ===== BODY ===== */
      let bodyHTML = "";

      rows.forEach(row => {
        bodyHTML += "<tr>";

        visible.forEach(i => {
          let val = row[i];
          const key = cols[i].toUpperCase();

          /* Currency formatting */
          if (currencySet.has(key) || key.includes("LOW") || key.includes("HIGH")) {
            val = formatEuro(val);
          }

          let cls = "";
          if (i === statusIndex) {
            const s = String(row[i]).toUpperCase();
            if (s === "BELOW") cls = "status-below";
            if (s === "ABOVE") cls = "status-above";
            if (s === "ON TARGET") cls = "status-on-target";
          }

          /* Light grey background LOW & HIGH */
          if (key.includes("LOW") || key.includes("HIGH")) {
            cls += " lowhigh-bg";
          }

          let style = "";
          if (key === "CURRENT BID") style = "font-weight:bold;";
          if (centerSet.has(key)) style += "text-align:center;";

          const extraCls = narrowSet.has(key) ? "narrow-col" : "";
          if (extraCls) cls += " " + extraCls;

          bodyHTML += `<td class="${cls}" style="${style}">${val}</td>`;
        });

        bodyHTML += "</tr>";
      });

      tbody.innerHTML = bodyHTML;
    }

    function startData() {
      loadData();
      setInterval(loadData, 5000);
    }
  </script>

</body>

</html>
