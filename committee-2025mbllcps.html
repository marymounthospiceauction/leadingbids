<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes, maximum-scale=5" />
  <title>Marymount Auction – Committee View</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: Calibri, Arial, sans-serif;
      background-color: #e6d4ad;
      min-height: 100%;
    }

    body { overflow-x: auto; }

    * { box-sizing: border-box; }

    /* ===== LOGIN SCREEN ===== */
    #loginScreen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #e6d4ad 0%, #f5e7c3 55%, #e6d4ad 100%);
      z-index: 9999;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.92);
      border-radius: 16px;
      padding: 26px 28px;
      width: 90%;
      max-width: 380px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      text-align: center;
    }

    .login-title {
      font-size: 1.5rem;
      margin-bottom: 6px;
      letter-spacing: 0.08em;
      font-weight: bold;
      text-transform: uppercase;
    }

    .login-subtitle {
      font-size: 0.9rem;
      margin-bottom: 18px;
    }

    .login-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 4px;
      text-align: left;
      font-weight: bold;
    }

    .login-input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #aaa;
      font-size: 1rem;
    }

    .login-button {
      width: 100%;
      padding: 12px;
      border: none;
      margin-top: 12px;
      border-radius: 999px;
      font-weight: bold;
      text-transform: uppercase;
      background: linear-gradient(135deg, #bc8b41, #e6ce91);
      cursor: pointer;
    }

    .login-error {
      margin-top: 6px;
      font-size: 0.8rem;
      color: red;
      min-height: 16px;
      text-align: left;
    }

    #protectedContent { display: none; }

    /* ===== HEADER ===== */
    .header-image img {
      width: 100%;
      max-width: 600px;
      margin: 10px auto 20px auto;
      display: block;
    }

    /* ===== BUTTON ===== */
    .button-section {
      display: flex;
      justify-content: center;
      padding: 20px 0;
    }

    .custom-button {
      width: 100%;
      max-width: 280px;
      padding: 10px 16px;
      background: #bc8b41;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
      color: black;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    /* ===== SUMMARY SECTION ===== */
    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      padding: 0 5px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .auction-total-label {
      font-size: 0.85rem;
      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: 0.06em;
    }

    .auction-total-value {
      font-size: 1.6rem;
      font-weight: bold;
    }

    .status-summary-wrapper {
      min-width: 160px;
      text-align: right;
    }

    .status-summary-title {
      font-size: 0.85rem;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .status-summary-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 8px;
      align-items: center;
      margin-bottom: 2px;
    }

    .status-summary-label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
    }

    .status-summary-count {
      font-size: 0.8rem;
      font-weight: bold;
      text-align: right;
    }

    .status-colour-box {
      width: 13px;
      height: 13px;
      border-radius: 3px;
      border: 1px solid #333;
    }

    .status-colour-below { background:#f8d7da; }
    .status-colour-on-target { background:#fff3cd; }
    .status-colour-above { background:#d4edda; }

    /* ===== TABLE ===== */
    .table-section { padding: 15px; width: 100%; }

    .table-container {
      background:white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      overflow-x: auto;
    }

    table { width:100%; border-collapse:collapse; }

    thead th {
      background:black;
      color:#bc8b41;
      padding:8px;
      border:1px solid #ddd;
      font-size:0.8rem;
      text-transform:uppercase;
      white-space:nowrap;
    }

    tbody td {
      border:1px solid #ccc;
      padding:6px;
      white-space:nowrap;
      font-size:0.8rem;
    }

    .status-below { background:#f8d7da; }
    .status-on-target { background:#fff3cd; }
    .status-above { background:#d4edda; }

    .lowhigh-bg {
      background:#f1f1f1 !important;
    }

    .narrow-col {
      max-width:150px;
      overflow:hidden;
      text-overflow:ellipsis;
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div id="loginScreen">
    <div class="login-card">
      <div class="login-title">Committee Login</div>
      <div class="login-subtitle">Enter the password to view the dashboard.</div>

      <form id="loginForm">
        <label class="login-label">Password</label>
        <input type="password" id="passwordInput" class="login-input" required />
        <button class="login-button">Unlock</button>
        <div id="loginError" class="login-error"></div>
      </form>
    </div>
  </div>

  <!-- CONTENT -->
  <div id="protectedContent">

    <div class="header-image">
      <img src="LiveHeader.png">
    </div>

    <div class="button-section">
      <a class="custom-button"
        href="https://docs.google.com/forms/d/e/1FAIpQLSf7DrJwXkG6gFfN_8JWCpyFt04tEsA5kFhpPHjRHSJx4C37rg/viewform"
        target="_blank">📝 Place an Auction Bid</a>
    </div>

    <div class="table-section">

      <!-- SUMMARY -->
      <div class="summary-row">
        <div>
          <div class="auction-total-label">AUCTION TOTAL</div>
          <div class="auction-total-value" id="auctionTotal">€0</div>
        </div>

        <div class="status-summary-wrapper">
          <div class="status-summary-title">STATUS SUMMARY</div>

          <div class="status-summary-row">
            <div class="status-summary-label"><span class="status-colour-box status-colour-below"></span> BELOW</div>
            <div class="status-summary-count" id="countBelow">0</div>
          </div>

          <div class="status-summary-row">
            <div class="status-summary-label"><span class="status-colour-box status-colour-on-target"></span> ON TARGET</div>
            <div class="status-summary-count" id="countOnTarget">0</div>
          </div>

          <div class="status-summary-row">
            <div class="status-summary-label"><span class="status-colour-box status-colour-above"></span> ABOVE</div>
            <div class="status-summary-count" id="countAbove">0</div>
          </div>
        </div>
      </div>

      <div class="table-container">
        <table id="bidsTable">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>

    </div>
  </div>

  <script>
    const PASSWORD = "starrynight";

    /* ===== LOGIN ===== */
    document.getElementById("loginForm").addEventListener("submit", e => {
      e.preventDefault();
      if (document.getElementById("passwordInput").value === PASSWORD) {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("protectedContent").style.display = "block";
        startData();
      } else {
        document.getElementById("loginError").textContent = "Incorrect password.";
      }
    });

    /* ===== DATA ===== */
    const sheetID = "1DKnonV1mO-irLiJ4b9M62XYOMEf3LqRvJtEvopvjAp0";
    const sheetName = "LIVE STATUS";
    const range = "A5:L44";

    const url = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json&sheet=${sheetName}&range=${range}`;

    /* Hidden Columns */
    const hiddenColumns = [
      "EMAIL ADDRESS", "CONTACT NUMBER", "TABLE NUMBER/NAME",
      "BID TIME"
    ];

    /* Currency Columns */
    const currencyColumns = [
      "LOW", "HIGH", "CURRENT BID", "COMMITTEE BID", "PUBLIC BID",
      "TARGET", "RESERVE", "VALUE"
    ];

    /* Center-aligned Columns – UPDATED */
    const centerColumns = [
      "LOW",               // LOW TARGET (centered)
      "HIGH",              // HIGH TARGET (centered)
      "JOINT HIGHEST BID", // NEW: centre-aligned
      "CURRENT BID",
      "STATUS",
      "NUMBER OF BIDS"
    ];

    const narrowColumns = ["ITEM", "ITEM DESCRIPTION"];

    const currencySet = new Set(currencyColumns);
    const centerSet = new Set(centerColumns);
    const narrowSet = new Set(narrowColumns);

    function formatEuro(v) {
      if (!v) return "";
      const n = Number(String(v).replace(/[^\d.-]/g, ""));
      if (isNaN(n)) return v;
      return "€" + n.toLocaleString("en-IE", { minimumFractionDigits: 0, maximumFractionDigits: 0 });
    }

    async function loadData() {
      const res = await fetch(url);
      const raw = await res.text();
      const json = JSON.parse(raw.substr(47).slice(0, -2));

      const cols = json.table.cols.map(c => c.label || "");
      const rows = json.table.rows.map(r => r.c.map(c => c?.v || ""));

      const thead = document.querySelector("#bidsTable thead");
      const tbody = document.querySelector("#bidsTable tbody");

      /* Determine visible columns */
      let visible = [];
      cols.forEach((lbl, i) => {
        if (!hiddenColumns.includes(lbl.toUpperCase())) visible.push(i);
      });

      const statusIndex = cols.findIndex(c => c.toUpperCase() === "STATUS");
      const bidIndex = cols.findIndex(c => c.toUpperCase() === "CURRENT BID");
      const bidsIndex = cols.findIndex(c => c.toUpperCase() === "NUMBER OF BIDS");

      /* STATUS first */
      if (statusIndex > -1) {
        visible = visible.filter(v => v !== statusIndex);
        visible.unshift(statusIndex);
      }

      /* BIDS moves to column #4 */
      if (bidsIndex > -1) {
        visible = visible.filter(v => v !== bidsIndex);
        visible.splice(3, 0, bidsIndex);
      }

      /* ===== HEADER ===== */
      let h = "<tr>";
      visible.forEach(i => {
        let label = cols[i];
        const key = label.toUpperCase();

        if (key.includes("LOW")) label = "LOW TARGET";
        if (key.includes("HIGH")) label = "HIGH TARGET";
        if (key === "CURRENT BID") label = "LEADING BID";
        if (key === "NUMBER OF BIDS") label = "BIDS";
        if (key === "NAME") label = "WINNER NAME";

        const cls = narrowSet.has(key) ? "narrow-col" : "";
        const style = centerSet.has(key) ? "text-align:center;" : "";

        h += `<th class="${cls}" style="${style}">${label}</th>`;
      });
      h += "</tr>";
      thead.innerHTML = h;

      /* ===== TOTALS ===== */
      let total = 0;
      let counts = { BELOW: 0, "ON TARGET": 0, ABOVE: 0 };

      rows.forEach(r => {
        const v = Number(String(r[bidIndex]).replace(/[^\d.-]/g, ""));
        if (!isNaN(v)) total += v;

        const s = String(r[statusIndex]).toUpperCase();
        if (counts[s] !== undefined) counts[s]++;
      });

      document.getElementById("auctionTotal").textContent = formatEuro(total);
      document.getElementById("countBelow").textContent = counts["BELOW"];
      document.getElementById("countOnTarget").textContent = counts["ON TARGET"];
      document.getElementById("countAbove").textContent = counts["ABOVE"];

      /* ===== BODY ===== */
      let bodyHTML = "";

      rows.forEach(row => {
        bodyHTML += "<tr>";

        visible.forEach(i => {
          const key = cols[i].toUpperCase();
          let v = row[i];

          if (currencySet.has(key) || key.includes("LOW") || key.includes("HIGH"))
            v = formatEuro(v);

          let cls = "";

          if (key === "STATUS") {
            const s = String(v).toUpperCase();
            if (s === "BELOW") cls = "status-below";
            if (s === "ON TARGET") cls = "status-on-target";
            if (s === "ABOVE") cls = "status-above";
          }

          if (key.includes("LOW") || key.includes("HIGH"))
            cls += " lowhigh-bg";

          if (narrowSet.has(key))
            cls += " narrow-col";

          let style = "";
          if (centerSet.has(key))
            style += "text-align:center;";
          if (key === "CURRENT BID")
            style += "font-weight:bold;";

          bodyHTML += `<td class="${cls}" style="${style}">${v ?? ""}</td>`;
        });

        bodyHTML += "</tr>";
      });

      tbody.innerHTML = bodyHTML;
    }

    function startData() {
      loadData();
      setInterval(loadData, 5000);
    }
  </script>

</body>
</html>
