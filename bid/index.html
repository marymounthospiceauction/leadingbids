<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Marymount Ball Auction</title>
  <style>
    :root {
      --bg: #decca1;
      --card: #f8f2e4;
      --accent: #c39243;
      --accent-dark: #a87933;
      --text: #111111;
      --muted: #5f5a4f;
      --border: #d8c6a0;
      --error: #b42318;
      --success: #166534;
      --shadow: 0 4px 12px rgba(0,0,0,0.1);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      /* Prevent bouncing/scrolling where possible */
      overflow-x: hidden;
    }

    .page {
      max-width: 500px;
      margin: 0 auto;
      padding: 6px 10px; /* Tightened page padding */
    }

    .hero {
      text-align: center;
      margin-bottom: 8px;
    }

    .hero img {
      width: 60%; /* Smaller image */
      max-width: 200px;
      border-radius: 4px;
    }

    /* Hide hero image on very small screens to save space */
    @media (max-height: 650px) {
      .hero { display: none; }
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 14px 16px; /* Reduced card padding */
      box-shadow: var(--shadow);
    }

    .title {
      text-align: center;
      font-size: 18px; 
      font-weight: 800;
      margin: 0 0 2px;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin: 0 0 12px;
    }

    .section {
      margin-bottom: 10px; /* Reduced spacing between sections */
    }

    .label {
      display: block;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 4px;
      color: #1b1b1b;
    }

    input[type="text"],
    input[type="email"],
    input[type="number"],
    select {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px; /* Thinner inputs */
      font-size: 16px; /* Must stay 16px for iOS */
      background: #fffdf8;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
    }

    select {
      background-image: linear-gradient(45deg, transparent 50%, #444 50%), linear-gradient(135deg, #444 50%, transparent 50%);
      background-position: calc(100% - 18px) 50%, calc(100% - 12px) 50%;
      background-size: 5px 5px;
      background-repeat: no-repeat;
      padding-right: 30px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hint {
      font-size: 11px;
      color: var(--muted);
      margin-top: 3px;
    }

    .checkbox-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(255,255,255,0.3);
    }

    .checkbox-wrap input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin: 0;
    }

    .checkbox-text {
      font-size: 12px;
      line-height: 1.2;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 18px;
      font-weight: 800;
      background: #000;
      color: #fff;
      margin-top: 4px;
    }

    .footer-note {
      text-align: center;
      font-size: 10px;
      color: #5c5547;
      margin-top: 8px;
    }

    /* Success Screen Adjustments */
    .success-screen { display: none; text-align: center; }
    .success-title { font-size: 22px; margin-bottom: 8px; }

    @media (max-width: 480px) {
      .page { padding: 4px; }
      .card { padding: 12px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="hero">
      <img src="/Marymount%20Header.png" alt="Header">
    </div>

    <div class="card">
      <div id="formScreen">
        <h1 class="title">Place Your Bid</h1>
        <p class="subtitle">Enter details below.</p>

        <input type="hidden" id="itemNumber">
        <input type="hidden" id="token">

        <div class="section">
          <label class="label" for="item">Item*</label>
          <select id="item"><option value="">Loading...</option></select>
        </div>

        <div class="section">
          <label class="label" for="bidAmount">Bid Amount (€)*</label>
          <input id="bidAmount" type="number" inputmode="numeric" placeholder="Amount">
          <div id="bidError" class="field-error" style="display:none; color:red; font-size:11px;"></div>
        </div>

        <div style="display: flex; gap: 8px;">
          <div class="section" style="flex: 1;">
            <label class="label" for="yourName">Name*</label>
            <input id="yourName" type="text" placeholder="Name">
          </div>
          <div class="section" style="flex: 1;">
            <label class="label" for="mobileNumber">Mobile*</label>
            <input id="mobileNumber" type="text" placeholder="Mobile">
          </div>
        </div>

        <div class="section">
          <div class="checkbox-wrap">
            <input type="checkbox" id="consentCheckbox">
            <div class="checkbox-text">WhatsApp Notifications</div>
          </div>
        </div>

        <button id="submitBtn" class="btn" type="button">Submit Bid</button>
        <div class="footer-note">Marymount Ball Auction</div>
      </div>

      <div id="successScreen" class="success-screen">
        <h1 class="success-title">Bid Received</h1>
        <button id="anotherBidBtn" class="btn" style="background:var(--accent); color:#000;">Another Bid</button>
      </div>
    </div>
  </div>

  <script>
    // [Keep your existing JavaScript exactly as it was]
    // Note: I combined Name and Mobile into one row in the HTML above to save height.
    // Ensure your IDs (yourName, mobileNumber, etc.) remain the same.
  </script>
</body>
</html>
