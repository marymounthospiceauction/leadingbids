<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Starry Night Ball – Live Bids</title>

  <!-- VIEWPORT -->
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes, maximum-scale=5" />

  <style>
    :root {
      --gold: #f6d58b;
      --gold-soft: #f4d28a;
      --black: #000000;
      --offwhite: #ffffff;
    }

    /* PAGE BACKGROUND – TV BACKGROUND IMAGE */
    body {
      margin: 0;
      font-family: Calibri, Arial, sans-serif;
      background: #000 url("tvbackground.png") center/cover no-repeat fixed;
      color: var(--offwhite);
      overflow-x: hidden;
      overflow-y: hidden; /* no page scroll – everything managed inside the frame */
    }

    * { box-sizing: border-box; }

    /* MAIN FRAME – transparent so background shows through */
    .frame {
      width: 96vw;
      height: 96vh;
      margin: 2vh auto;
      border: 6px solid var(--gold);
      box-shadow: 0 0 25px rgba(0,0,0,0.9);
      background: transparent;
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 1.5vh 2vw 1vh 2vw;
    }

    /* HEADER AREA – LiveHeader centered, Marymount logo top right */
    .header {
      position: relative;
      text-align: center;
      margin-bottom: 1vh;
      flex: 0 0 auto;
    }

    .header-img {
      max-height: 13vh;
      max-width: 70%;
      object-fit: contain;
      filter: drop-shadow(0 0 6px rgba(0,0,0,0.8));
      display: block;
      margin: 0 auto;
    }

    .marymount-logo-top {
      position: absolute;
      right: 0;
      top: 0;
      max-height: 10vh;
      object-fit: contain;
      filter: drop-shadow(0 0 6px rgba(0,0,0,0.9));
    }

    /* ITEMS GRID (2 COLUMNS, SCROLLABLE IF NEEDED) */
    .items-grid {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      gap: 1.6vw;
      margin-top: 0.5vh;
      margin-bottom: 0.6vh;
      opacity: 0;
      transition: opacity 0.3s ease;
      overflow-y: auto;
      padding-right: 0.4vw;
    }

    .column {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.25vh;
    }

    .item-row {
      display: grid;
      grid-template-columns: 1fr auto;
      background: rgba(0,0,0,0.9);
      border: 1px solid #3a3a3a;
      box-shadow: 0 0 6px rgba(0,0,0,0.6);
      overflow: hidden;
      align-items: center;          /* vertical centring of grid cells */
    }

    /* Vertically centre contents in each cell */
    .item-label,
    .item-amount {
      display: flex;
      align-items: center;          /* vertical */
    }

    .item-label {
      padding: 0.25em 0.7em;
      font-size: clamp(0.8rem, 1vw, 1.2rem);
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--offwhite);
      justify-content: flex-start;  /* left align text */
    }

    .item-amount {
      padding: 0.25em 0.9em;
      min-width: 6vw;
      font-size: clamp(0.8rem, 1vw, 1.2rem);
      font-weight: bold;
      color: var(--gold-soft);
      border-left: 1px solid #555;
      justify-content: flex-end;    /* right align amount */
      text-align: right;
    }

    .item-label strong {
      font-weight: 700;
      letter-spacing: 0.03em;
      color: var(--gold-soft);
    }

    /* SPONSOR STRIP */
    .sponsors {
      width: 100%;
      text-align: center;
      margin-top: 0.2vh;
      margin-bottom: 0.2vh;
      flex: 0 0 auto;
    }

    .sponsors img {
      max-height: 7vh;
      max-width: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 5px rgba(0,0,0,0.7));
    }

    /* FOOTER AREA – QR | URL | QR equally spaced */
    .footer {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 1.6vw;
      margin-top: 0.2vh;
      flex: 0 0 auto;
    }

    .footer-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
      font-size: clamp(0.6rem, 0.8vw, 0.95rem);
      text-align: center;
    }

    .qr-img {
      max-height: 9vh;
      margin-bottom: 0.4vh;
      object-fit: contain;
      background: rgba(255,255,255,0.98);
      padding: 0.4vh;
      border-radius: 0.3rem;
      box-shadow: 0 0 8px rgba(0,0,0,0.8);
    }

    /* More readable "SCAN QR CODE TO BID" text */
    .footer-block span {
      color: var(--gold);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-shadow: 0 0 4px rgba(0,0,0,0.9);
    }

    /* ENHANCED, CENTRED WEBSITE TEXT */
    .footer-center {
      text-align: center;
      font-size: clamp(1rem, 1.3vw, 1.6rem);
      font-weight: 800;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 0.18em;
      padding: 0.3em 1.8em;
      border-radius: 999px;
      border: 2px solid var(--gold);
      box-shadow: 0 0 12px rgba(0,0,0,0.9);
      background: rgba(0,0,0,0.85);
      justify-self: center;
    }

    .footer-center span {
      text-shadow: 0 0 6px rgba(0,0,0,0.9);
    }

    @media (max-width: 900px) {
      .frame {
        height: auto;
      }
      .items-grid {
        flex-direction: column;
      }
      .footer {
        grid-template-columns: 1fr;
        row-gap: 1vh;
        justify-items: center;
      }
    }
  </style>
</head>

<body>

  <div class="frame">

    <!-- HEADER USING LiveHeader.png and Marymount logo in top-right -->
    <div class="header">
      <img class="header-img"
           src="LiveHeader.png"
           alt="Live Auction Header" />
      <img class="marymount-logo-top"
           src="Marymount%20Logo.png"
           alt="Marymount Logo" />
    </div>

    <!-- TWO-COLUMN ITEMS GRID (SCROLLABLE IF TOO TALL) -->
    <div class="items-grid">
      <div class="column" id="column-left"></div>
      <div class="column" id="column-right"></div>
    </div>

    <!-- SPONSOR FOOTER STRIP -->
    <div class="sponsors">
      <img src="Marymount%20Footer%20Sponsors.png"
           alt="Marymount Sponsors" />
    </div>

    <!-- FOOTER WITH TWO QR CODES + CENTRED URL -->
    <div class="footer">
      <!-- LEFT QR CODE -->
      <div class="footer-block">
        <img class="qr-img"
             src="2025%20Marymount%20QR%20Code.jpeg"
             alt="QR Code to Bid (Left)" />
        <span>SCAN QR CODE TO BID</span>
      </div>

      <!-- CENTRED & ENHANCED WEBSITE TEXT -->
      <div class="footer-center">
        <span>www.marymountauction2025.ie</span>
      </div>

      <!-- RIGHT QR CODE -->
      <div class="footer-block">
        <img class="qr-img"
             src="2025%20Marymount%20QR%20Code.jpeg"
             alt="QR Code to Bid (Right)" />
        <span>SCAN QR CODE TO BID</span>
      </div>
    </div>

  </div>

  <script>
    /* GOOGLE SHEET CONFIG
       Uses range X5:Z42 so that we can use the “NEW BID” column.
       Assumption:
         X = Item label (e.g., "ITEM 01 - WIMBLEDON LADIES FINAL")
         Y = Existing bid (optional)
         Z = NEW BID value – preferred for display
    */

    const sheetID   = '1UdOW-OSvZUxlHEzPz0--FDtFcSMTjbZLDo-OhwRr_Mc';
    const sheetName = 'LEADING BIDS';      // change if needed
    const range     = 'X5:Z42';            // ITEM | (maybe old bid) | NEW BID

    const url =
      `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json` +
      `&sheet=${encodeURIComponent(sheetName)}&range=${range}`;

    function formatEuro(value) {
      if (value === null || value === '' || isNaN(value)) return '';
      return '€' + Number(value).toLocaleString('en-IE', {
        maximumFractionDigits: 0
      });
    }

    // Bold “ITEM 01 - ” (first 7 chars)
    function boldFirstSeven(text) {
      if (!text) return '';
      return '<strong>' + text.substring(0, 7) + '</strong>' + text.substring(7);
    }

    async function loadData() {
      try {
        const res  = await fetch(url);
        const text = await res.text();

        // Google Visualization API response wrapper
        const json = JSON.parse(text.substr(47).slice(0, -2));
        const rows = json.table.rows.map(r => r.c.map(c => c ? c.v : ''));

        const leftCol  = document.getElementById('column-left');
        const rightCol = document.getElementById('column-right');

        let leftHTML  = '';
        let rightHTML = '';

        // Split items into two columns
        const half = Math.ceil(rows.length / 2);

        rows.forEach((row, index) => {
          const labelRaw = row[0] || '';
          const newBid   = row[2] !== '' ? row[2] : row[1]; // prefer NEW BID (Z); fall back to Y
          const amount   = formatEuro(newBid);

          const labelHTML = boldFirstSeven(labelRaw);

          const rowHTML = `
            <div class="item-row">
              <div class="item-label">${labelHTML}</div>
              <div class="item-amount">${amount}</div>
            </div>
          `;

          if (index < half) {
            leftHTML += rowHTML;
          } else {
            rightHTML += rowHTML;
          }
        });

        leftCol.innerHTML  = leftHTML;
        rightCol.innerHTML = rightHTML;

        // Show grid once data is ready
        document.querySelector('.items-grid').style.opacity = 1;

      } catch (err) {
        console.error('Failed to load sheet data', err);
      }
    }

    loadData();
    // Refresh every 5 seconds so NEW BID values stay current
    setInterval(loadData, 5000);
  </script>

</body>
</html>
