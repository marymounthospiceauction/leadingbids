
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Starry Night Ball – Live Bids</title>

  <!-- VIEWPORT -->
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes, maximum-scale=5" />

  <!-- Script-style font -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet" />

  <style>
    :root {
      --gold: #f6d58b;
      --gold-soft: #f4d28a;
      --black: #000000;
      --offwhite: #ffffff;

      /* Safe-area padding to counter TV overscan */
      --frame-pad-vh: 1.4vh;    /* bump if your TV trims edges */
      --frame-pad-vw: 3vw;

      /* Footer band height (QR + Sponsors centred) */
      --footer-h: 8.5vh;

      /* Shared row height (set by JS) so rows align perfectly across columns */
      --rowH: 40px;

      /* Unified vertical gap between rows in both columns */
      --row-gap: 0.22vh;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Calibri, Arial, sans-serif;
      background: #000 url("tvbackground.png") center/cover no-repeat fixed;
      color: var(--offwhite);
      overflow: hidden; /* TVs must not show scrollbars */
    }

    /* FULL-SCREEN CONTAINER – reserve space for footer inside safe area */
    .frame {
      width: 100vw;
      height: 100vh;
      padding: var(--frame-pad-vh) var(--frame-pad-vw);
      /* Reserve the footer height so items-grid can size correctly */
      padding-bottom: calc(var(--frame-pad-vh) + var(--footer-h));
      display: flex;
      flex-direction: column;
      background: transparent;
    }

    /* HEADER */
    .header {
      position: relative;
      flex: 0 0 auto;
      margin-bottom: 0.4vh;
      text-align: center;
    }

    .header-title {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(2.6rem, 4.2vw, 5rem);
      font-weight: 400;
      color: #000; /* black for readability */
      text-shadow:
        0 0 6px rgba(246,213,139,0.9),
        0 0 12px rgba(246,213,139,0.7),
        0 0 18px rgba(0,0,0,0.9);
      letter-spacing: 0.04em;
      line-height: 1.06;
    }

    .marymount-logo-top {
      position: absolute;
      right: 0;
      top: 0;
      max-height: 8.5vh;
      object-fit: contain;
      filter: drop-shadow(0 0 6px rgba(0,0,0,0.9));
    }

    /* ITEMS GRID – fills remaining vertical space explicitly */
    .items-grid {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      gap: 1.1vw;       /* horizontal gap between columns */
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
      margin-top: 0.2vh;
      margin-bottom: 0.2vh;
      overflow: hidden; /* no scrollbars on TV */
    }

    .column {
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      gap: var(--row-gap);  /* unified gap used in calculations */
    }

    .item-row {
      display: grid;
      grid-template-columns: 1fr max-content;
      align-items: center;
      height: var(--rowH);              /* exact, shared height per row */
      background: rgba(0,0,0,0.9);
      border: 1px solid #3a3a3a;
      box-shadow: 0 0 4px rgba(0,0,0,0.5);
    }

    .item-label,
    .item-amount {
      display: flex;
      align-items: center;
      /* font scales with shared row height, clamped for crispness */
      font-size: clamp(14px, calc(var(--rowH) * 0.52), 32px);
      line-height: 1.12;
    }

    .item-label {
      padding: 0.16em 0.6em;
      text-transform: uppercase;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .item-label strong {
      font-weight: 800;
      color: var(--gold-soft);
      letter-spacing: 0.02em;
    }

    .item-amount {
      padding: 0.16em 1.0em;
      font-weight: 800;

      /* reserve width for big € amounts; keeps layout stable */
      min-width: clamp(9ch, 11vw, 20vw);

      /* Center the latest bid column text */
      justify-content: center;
      text-align: center;

      color: var(--gold-soft);
      border-left: 1px solid #555;
    }

    /* FOOTER – fixed inside the frame safe area, 3-column grid: QR | Sponsors | QR */
    .footer {
      position: fixed;
      left: var(--frame-pad-vw);
      right: var(--frame-pad-vw);
      bottom: var(--frame-pad-vh);    /* sit within the visible safe area */
      height: var(--footer-h);
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 2vw; /* space between QR and sponsors */
      /* Optional subtle backdrop for readability:
         background: rgba(0,0,0,0.10); border-radius: 0.4rem; */
    }

    .footer-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 100%;
    }

    .qr-img {
      max-height: calc(var(--footer-h) * 0.70);  /* QR fits within footer */
      background: rgba(255,255,255,0.98);
      padding: 0.4vh;
      border-radius: 0.3rem;
      box-shadow: 0 0 8px rgba(0,0,0,0.9);
      margin-bottom: 0.35vh;
    }

    .footer-block span {
      font-size: clamp(0.8rem, 1vw, 1.2rem);
      font-weight: 700;
      color: #000000;
      letter-spacing: 0.05em;
      text-shadow: 0 0 3px rgba(255,255,255,0.7);
      text-transform: uppercase;
    }

    /* Sponsors sits centred between QR blocks */
    .footer-sponsors {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      pointer-events: none; /* avoids accidental focus */
    }

    .footer-sponsors img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 5px rgba(0,0,0,0.8));
    }
  </style>
</head>

<body>

  <div class="frame">

    <!-- HEADER -->
    <div class="header">
      <div class="header-title">The Starry Night Ball</div>
      <img class="marymount-logo-top" src="Marymount%20Logo.png" alt="Marymount Logo" />
    </div>

    <!-- 2-COLUMN GRID -->
    <div class="items-grid">
      <div class="column" id="column-left"></div>
      <div class="column" id="column-right"></div>
    </div>

  </div>

  <!-- FOOTER – QR | SPONSORS | QR -->
  <div class="footer">
    <div class="footer-block">
      <img class="qr-img" src="2025%20Marymount%20QR%20Code.jpeg" alt="QR Code to Bid (Left)" />
      <span>Scan QR code to bid</span>
    </div>

    <div class="footer-sponsors">
      <img src="Marymount%20Footer%20Sponsors.png" alt="Sponsors" />
    </div>

    <div class="footer-block">
      <img class="qr-img" src="2025%20Marymount%20QR%20Code.jpeg" alt="QR Code to Bid (Right)" />
      <span>Scan QR code to bid</span>
    </div>
  </div>

  <script>
    const sheetID   = '1UdOW-OSvZUxlHEzPz0--FDtFcSMTjbZLDo-OhwRr_Mc';
    const sheetName = 'LEADING BIDS';
    const range     = 'X5:Z42'; // 37 items expected

    const url =
      `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json` +
      `&sheet=${encodeURIComponent(sheetName)}&range=${range}`;

    function formatEuro(v) {
      if (v === null || v === undefined || v === '' || isNaN(v)) return '€0';
      return '€' + Number(v).toLocaleString('en-IE', { maximumFractionDigits: 0 });
    }

    function boldFirstSeven(t) {
      if (!t) return '';
      const s = t.toString();
      return '<strong>' + s.substring(0,7) + '</strong>' + s.substring(7);
    }

    /**
     * Compute a SINGLE shared row height so both columns align perfectly.
     * We use the available items-grid height minus total vertical gaps.
     * Footer height is already reserved via .frame padding-bottom.
     */
    function applyAlignedRowHeights(totalRows, leftCount, rightCount) {
      const itemsGrid = document.querySelector('.items-grid');
      const leftCol   = document.getElementById('column-left');

      // Available height inside items-grid
      const gridRect   = itemsGrid.getBoundingClientRect();
      const availableH = gridRect.height;

      // Unified column vertical gap (px) from computed style
      const gapStr = getComputedStyle(leftCol).gap || '0px';
      const gapPx  = parseFloat(gapStr.split(' ')[0]) || 0;

      // Total gaps per column
      const leftGaps  = Math.max(0, (leftCount  - 1)) * gapPx;
      const rightGaps = Math.max(0, (rightCount - 1)) * gapPx;

      // Row height required per column; choose the MIN to guarantee fit
      const leftRowHRequired  = (availableH - leftGaps)  / leftCount;
      const rightRowHRequired = (availableH - rightGaps) / rightCount;
      const sharedRowH = Math.floor(Math.min(leftRowHRequired, rightRowHRequired));

      // Apply shared row height via CSS var (both columns read --rowH)
      document.documentElement.style.setProperty('--rowH', sharedRowH + 'px');

      // Reveal after setting aligned heights
      document.querySelector('.items-grid').style.opacity = 1;
    }

    function renderRows(rows) {
      const leftCol  = document.getElementById('column-left');
      const rightCol = document.getElementById('column-right');

      const half = Math.ceil(rows.length / 2); // 19 left, 18 right for 37

      const leftHTML  = rows.slice(0, half).map(r => {
        const item = boldFirstSeven((r[0] ?? '').toString());
        const bid  = formatEuro(r[2] ?? r[1]);
        return `
          <div class="item-row">
            <div class="item-label">${item}</div>
            <div class="item-amount">${bid}</div>
          </div>
        `;
      }).join('');

      const rightHTML = rows.slice(half).map(r => {
        const item = boldFirstSeven((r[0] ?? '').toString());
        const bid  = formatEuro(r[2] ?? r[1]);
        return `
          <div class="item-row">
            <div class="item-label">${item}</div>
            <div class="item-amount">${bid}</div>
          </div>
        `;
      }).join('');

      leftCol.innerHTML  = leftHTML;
      rightCol.innerHTML = rightHTML;

      // After DOM update, compute shared height and reveal
      requestAnimationFrame(() => {
        applyAlignedRowHeights(rows.length, half, rows.length - half);
      });
    }

    async function loadData() {
      try {
        const res  = await fetch(url);
        const text = await res.text();
        const json = JSON.parse(text.substr(47).slice(0, -2));
        const rows = json.table.rows.map(r => r.c.map(c => (c ? c.v : '')));

        renderRows(rows);
      } catch (e) {
        console.error("Sheet load error", e);
      }
    }

    // Initial load and periodic refresh
    loadData();
    const REFRESH_MS = 5000;
    setInterval(loadData, REFRESH_MS);

    // Re-apply heights on resize/orientation/fullscreen changes
    const reflow = () => {
      const leftCol    = document.getElementById('column-left');
      const rightCol   = document.getElementById('column-right');
      const leftCount  = leftCol.children.length;
      const rightCount = rightCol.children.length;
      if (leftCount && rightCount) {
        applyAlignedRowHeights(leftCount + rightCount, leftCount, rightCount);
      }
    };
    window.addEventListener('resize', reflow);
    window.addEventListener('orientationchange', reflow);
    document.addEventListener('fullscreenchange', reflow);
  </script>

</body>
