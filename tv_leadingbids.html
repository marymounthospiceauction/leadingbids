
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Starry Night Ball – Live Bids</title>

  <!-- VIEWPORT -->
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes, maximum-scale=5" />

  <!-- Script-style font -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet" />

  <style>
    :root {
      --gold: #f6d58b;
      --gold-soft: #f4d28a;
      --black: #000000;
      --offwhite: #ffffff;

      /* Safe-area padding to counter TV overscan */
      --frame-pad-vh: 1.2vh;
      --frame-pad-vw: 3vw;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Calibri, Arial, sans-serif;
      background: #000 url("tvbackground.png") center/cover no-repeat fixed;
      color: var(--offwhite);
      overflow: hidden; /* TVs must not show scrollbars */
    }

    /* FULL-SCREEN CONTAINER – NO INNER FRAME/BORDER */
    .frame {
      width: 100vw;
      height: 100vh;
      padding: var(--frame-pad-vh) var(--frame-pad-vw);
      display: flex;
      flex-direction: column;
      background: transparent;
    }

    /* HEADER TEXT + LOGO */
    .header {
      position: relative;
      flex: 0 0 auto;
      margin-bottom: 0.5vh;
      text-align: center;
    }

    .header-title {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(2.3rem, 3.6vw, 4.2rem);
      font-weight: 400;
      color: #000000; /* black for readability */
      text-shadow:
        0 0 6px rgba(246,213,139,0.9),
        0 0 12px rgba(246,213,139,0.7),
        0 0 18px rgba(0,0,0,0.9);
      letter-spacing: 0.04em;
      line-height: 1.05;
    }

    .marymount-logo-top {
      position: absolute;
      right: 0;
      top: 0;
      max-height: 8.5vh;
      object-fit: contain;
      filter: drop-shadow(0 0 6px rgba(0,0,0,0.9));
    }

    /* ITEMS GRID – fills remaining vertical space explicitly */
    .items-grid {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      gap: 1.1vw;       /* horizontal gap between columns */
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
      margin-top: 0.2vh;
      margin-bottom: 0.5vh;
      overflow: hidden; /* no scrollbars on TV */
    }

    .column {
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      /* Vertical gap between rows (used in height calculations) */
      gap: 0.25vh;
      /* Each column gets its own computed row height via --rowH */
      --rowH: 36px; /* will be overridden by JS per column */
    }

    .item-row {
      display: grid;
      grid-template-columns: 1fr max-content;
      align-items: center;
      height: var(--rowH);              /* exact height per row */
      background: rgba(0,0,0,0.88);
      border: 1px solid #3a3a3a;
      box-shadow: 0 0 4px rgba(0,0,0,0.5);
    }

    .item-label,
    .item-amount {
      display: flex;
      align-items: center; /* vertical centring */
      /* font scales with row height but is clamped to stay crisp on 4K */
      font-size: clamp(12px, calc(var(--rowH) * 0.42), 28px);
      line-height: 1.1;
    }

    .item-label {
      padding: 0.16em 0.55em;
      text-transform: uppercase;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .item-label strong {
      font-weight: 700;
      color: var(--gold-soft);
    }

    .item-amount {
      padding: 0.16em 0.85em;
      font-weight: 700;
      /* reserve space for big € amounts; stays responsive on 1080p/4K */
      min-width: clamp(8ch, 10vw, 18vw);
      justify-content: flex-end;
      color: var(--gold-soft);
      border-left: 1px solid #555;
      text-align: right;
    }

    /* SUPPLIERS – larger & dropped down, in normal flow */
    .sponsors {
      flex: 0 0 auto;
      text-align: center;
      margin: 0.4vh 0 0.3vh;
    }

    .sponsors img {
      max-height: 11.5vh; /* keep footer visible on TVs with overscan */
      max-width: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 5px rgba(0,0,0,0.8));
    }

    /* FOOTER – QR codes row */
    .footer {
      flex: 0 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 0.1vh;
    }

    .footer-block {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .qr-img {
      max-height: 8.2vh;
      background: rgba(255,255,255,0.98);
      padding: 0.4vh;
      border-radius: 0.3rem;
      box-shadow: 0 0 8px rgba(0,0,0,0.9);
      margin-bottom: 0.15vh;
    }

    .footer-block span {
      font-size: clamp(0.7rem, 0.9vw, 1.1rem);
      font-weight: 600;
      color: #000000;
      letter-spacing: 0.05em;
      text-shadow: 0 0 3px rgba(255,255,255,0.7);
      text-transform: uppercase;
    }

    /* WEBSITE ADDRESS – bottom centre, lifted slightly off the frame */
    .website-bar {
      flex: 0 0 auto;
      text-align: center;
      margin-top: 0.2vh;
      margin-bottom: 0.8vh;
      font-size: clamp(0.85rem, 1.05vw, 1.3rem);
      font-weight: 700;
      color: #000000;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      text-shadow: 0 0 4px rgba(255,255,255,0.7);
    }
  </style>
</head>

<body>

  <div class="frame">

    <!-- HEADER TEXT -->
    <div class="header">
      <div class="header-title">The Starry Night Ball</div>
      <img class="marymount-logo-top"
           src="Marymount%20Logo.png"
           alt="Marymount Logo" />
    </div>

    <!-- 2-COLUMN GRID -->
    <div class="items-grid">
      <div class="column" id="column-left"></div>
      <div class="column" id="column-right"></div>
    </div>

    <!-- SUPPLIERS (LARGER, LOWER) -->
    <div class="sponsors">
      <img src="Marymount%20Footer%20Sponsors.png" alt="Sponsors" />
    </div>

    <!-- FOOTER – QR CODES -->
    <div class="footer">
      <div class="footer-block">
        <img class="qr-img" src="2025%20Marymount%20QR%20Code.jpeg" alt="QR Code to Bid (Left)" />
        <span>Scan QR code to bid</span>
      </div>

      <div class="footer-block">
        <img class="qr-img" src="2025%20Marymount%20QR%20Code.jpeg" alt="QR Code to Bid (Right)" />
        <span>Scan QR code to bid</span>
      </div>
    </div>

    <!-- WEBSITE – BOTTOM CENTRE, ABOVE FRAME -->
    <div class="website-bar">www.marymountauction2025.ie</div>

  </div>

  <script>
    const sheetID   = '1UdOW-OSvZUxlHEzPz0--FDtFcSMTjbZLDo-OhwRr_Mc';
    const sheetName = 'LEADING BIDS';
    const range     = 'X5:Z42'; // 37 items expected

    const url =
      `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json` +
      `&sheet=${encodeURIComponent(sheetName)}&range=${range}`;

    function formatEuro(v) {
      if (!v || isNaN(v)) return '€0';
      return '€' + Number(v).toLocaleString('en-IE', { maximumFractionDigits: 0 });
    }

    function boldFirstSeven(t) {
      if (!t) return '';
      return '<strong>' + t.substring(0,7) + '</strong>' + t.substring(7);
    }

    /**
     * Compute exact row heights so all items fit without scroll/overlap.
     * Each column gets its own height based on item count and vertical gaps.
     */
    function applyDeterministicHeights(leftCount, rightCount) {
      const itemsGrid = document.querySelector('.items-grid');
      const leftCol   = document.getElementById('column-left');
      const rightCol  = document.getElementById('column-right');

      // Available height inside items-grid
      const gridRect = itemsGrid.getBoundingClientRect();
      const availableH = gridRect.height;

      // Column vertical gaps (px) – take the first value of gap shorthand
      const leftStyles = getComputedStyle(leftCol);
      const gapStr     = leftStyles.gap || '0px';
      const gapPx      = parseFloat(gapStr.split(' ')[0]) || 0;

      // Exact per-row heights (fill space minus gaps)
      const leftTotalGaps  = Math.max(0, (leftCount - 1)) * gapPx;
      const rightTotalGaps = Math.max(0, (rightCount - 1)) * gapPx;

      const leftRowH  = Math.floor((availableH - leftTotalGaps) / leftCount);
      const rightRowH = Math.floor((availableH - rightTotalGaps) / rightCount);

      // Apply to columns via CSS vars
      leftCol.style.setProperty('--rowH', leftRowH + 'px');
      rightCol.style.setProperty('--rowH', rightRowH + 'px');
    }

    function renderRows(rows) {
      const leftCol  = document.getElementById('column-left');
      const rightCol = document.getElementById('column-right');

      const half = Math.ceil(rows.length / 2); // 19 on left, 18 on right for 37

      const leftHTML  = rows.slice(0, half).map(r => {
        const item = boldFirstSeven((r[0] ?? '').toString());
        const bid  = formatEuro(r[2] ?? r[1]);
        return `
          <div class="item-row">
            <div class="item-label">${item}</div>
            <div class="item-amount">${bid}</div>
          </div>
        `;
      }).join('');

      const rightHTML = rows.slice(half).map(r => {
        const item = boldFirstSeven((r[0] ?? '').toString());
        const bid  = formatEuro(r[2] ?? r[1]);
        return `
          <div class="item-row">
            <div class="item-label">${item}</div>
            <div class="item-amount">${bid}</div>
          </div>
        `;
      }).join('');

      leftCol.innerHTML  = leftHTML;
      rightCol.innerHTML = rightHTML;

      // After DOM update, compute exact heights and reveal
      requestAnimationFrame(() => {
        applyDeterministicHeights(half, rows.length - half);
        document.querySelector('.items-grid').style.opacity = 1;
      });
    }

    async function loadData() {
      try {
        const res  = await fetch(url);
        const text = await res.text();
        const json = JSON.parse(text.substr(47).slice(0, -2));
        const rows = json.table.rows.map(r => r.c.map(c => (c ? c.v : '')));

        renderRows(rows);
      } catch (e) {
        console.error("Sheet load error", e);
      }
    }

    // Initial load and refresh
    loadData();
    const REFRESH_MS = 5000;
    const refreshTimer = setInterval(loadData, REFRESH_MS);

    // Re-apply heights on resize/orientation changes (TVs can scale differently)
    const reflow = () => {
      const leftCol  = document.getElementById('column-left');
      const rightCol = document.getElementById('column-right');
      const leftCount  = leftCol.children.length;
      const rightCount = rightCol.children.length;
      if (leftCount && rightCount) {
        applyDeterministicHeights(leftCount, rightCount);
      }
    };
    window.addEventListener('resize', reflow);
    window.addEventListener('orientationchange', reflow);
    document.addEventListener('fullscreenchange', reflow);
  </script>

</body>
</html>
