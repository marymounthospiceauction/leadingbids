<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Starry Night Ball – Live Bids</title>

  <!-- VIEWPORT -->
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes, maximum-scale=5" />

  <!-- Elegant script font similar to your screenshot -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet" />

  <style>
    :root {
      --gold: #f6d58b;
      --gold-soft: #f4d28a;
      --black: #000000;
      --offwhite: #ffffff;
    }

    body {
      margin: 0;
      font-family: Calibri, Arial, sans-serif;
      background: #000 url("tvbackground.png") center/cover no-repeat fixed;
      color: var(--offwhite);
      overflow: hidden;
    }

    * { box-sizing: border-box; }

    .frame {
      width: 96vw;
      height: 96vh;
      margin: 2vh auto;
      border: 6px solid var(--gold);
      box-shadow: 0 0 25px rgba(0,0,0,0.9);
      background: transparent;
      display: flex;
      flex-direction: column;
      padding: 1.5vh 2vw 1vh 2vw;
    }

    /* HEADER TEXT + LOGO */
    .header {
      position: relative;
      flex: 0 0 auto;
      margin-bottom: 1vh;
      padding-top: 0.5vh;
      text-align: center;
    }

    .header-title {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(3rem, 5vw, 6rem);
      font-weight: 400;
      color: var(--gold);
      text-shadow: 0 0 10px rgba(0,0,0,0.9);
      letter-spacing: 0.04em;
    }

    .marymount-logo-top {
      position: absolute;
      right: 0;
      top: 0;
      max-height: 10vh;
      object-fit: contain;
      filter: drop-shadow(0 0 6px rgba(0,0,0,0.9));
    }

    /* ITEMS GRID */
    .items-grid {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      gap: 1.6vw;
      opacity: 0;
      overflow-y: auto;
      transition: opacity 0.3s ease;
    }

    .column {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.25vh;
    }

    .item-row {
      display: grid;
      grid-template-columns: 1fr auto;
      background: rgba(0,0,0,0.9);
      border: 1px solid #3a3a3a;
      align-items: center;
      box-shadow: 0 0 6px rgba(0,0,0,0.6);
    }

    .item-label,
    .item-amount {
      display: flex;
      align-items: center;
    }

    .item-label {
      padding: 0.3em 0.7em;
      font-size: clamp(0.8rem, 1vw, 1.2rem);
      text-transform: uppercase;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .item-label strong {
      font-weight: 700;
      color: var(--gold-soft);
    }

    .item-amount {
      padding: 0.3em 1em;
      font-size: clamp(0.8rem, 1vw, 1.2rem);
      font-weight: bold;
      min-width: 6vw;
      justify-content: flex-end;
      color: var(--gold-soft);
      border-left: 1px solid #555;
    }

    /* SPONSOR STRIP */
    .sponsors {
      flex: 0 0 auto;
      text-align: center;
      margin: 0.4vh 0;
    }

    .sponsors img {
      max-height: 7vh;
      filter: drop-shadow(0 0 5px rgba(0,0,0,0.8));
    }

    /* FOOTER (3 equal blocks) */
    .footer {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 2vw;
    }

    .footer-block {
      text-align: center;
    }

    .qr-img {
      max-height: 9vh;
      background: rgba(255,255,255,0.98);
      padding: 0.4vh;
      border-radius: 0.3rem;
      box-shadow: 0 0 8px rgba(0,0,0,0.9);
      margin-bottom: 0.4vh;
    }

    .footer-block span {
      font-size: clamp(0.7rem, 1vw, 1.1rem);
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 0.06em;
      text-shadow: 0 0 4px rgba(0,0,0,0.9);
    }

    .footer-center {
      text-align: center;
      font-size: clamp(1rem, 1.4vw, 1.9rem);
      font-weight: 800;
      color: var(--gold);
      text-transform: uppercase;
      padding: 0.4em 2em;
      border-radius: 999px;
      border: 2px solid var(--gold);
      background: rgba(0,0,0,0.85);
      letter-spacing: 0.18em;
      text-shadow: 0 0 6px rgba(0,0,0,0.9);
    }
  </style>
</head>

<body>

  <div class="frame">

    <!-- HEADER TEXT -->
    <div class="header">
      <div class="header-title">The Starry Night Ball</div>

      <img class="marymount-logo-top"
           src="Marymount%20Logo.png"
           alt="Marymount Logo" />
    </div>

    <!-- 2 COLUMN GRID -->
    <div class="items-grid">
      <div class="column" id="column-left"></div>
      <div class="column" id="column-right"></div>
    </div>

    <!-- SPONSORS -->
    <div class="sponsors">
      <img src="Marymount%20Footer%20Sponsors.png" alt="Sponsors" />
    </div>

    <!-- FOOTER -->
    <div class="footer">

      <div class="footer-block">
        <img class="qr-img" src="2025%20Marymount%20QR%20Code.jpeg" />
        <span>SCAN QR CODE TO BID</span>
      </div>

      <div class="footer-center">
        www.marymountauction2025.ie
      </div>

      <div class="footer-block">
        <img class="qr-img" src="2025%20Marymount%20QR%20Code.jpeg" />
        <span>SCAN QR CODE TO BID</span>
      </div>

    </div>

  </div>

<script>
const sheetID   = '1UdOW-OSvZUxlHEzPz0--FDtFcSMTjbZLDo-OhwRr_Mc';
const sheetName = 'LEADING BIDS';
const range     = 'X5:Z42';

const url =
  `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json` +
  `&sheet=${encodeURIComponent(sheetName)}&range=${range}`;

function formatEuro(v) {
  if (!v || isNaN(v)) return '€0';
  return '€' + Number(v).toLocaleString('en-IE');
}

function boldFirstSeven(t) {
  return '<strong>' + t.substring(0,7) + '</strong>' + t.substring(7);
}

async function loadData() {
  try {
    const res  = await fetch(url);
    const text = await res.text();
    const json = JSON.parse(text.substr(47).slice(0, -2));
    const rows = json.table.rows.map(r => r.c.map(c => c ? c.v : ''));

    const left  = document.getElementById('column-left');
    const right = document.getElementById('column-right');

    let leftHTML = '';
    let rightHTML = '';

    const half = Math.ceil(rows.length / 2);

    rows.forEach((r, i) => {
      const item = boldFirstSeven(r[0]);
      const bid  = formatEuro(r[2] || r[1]);

      const row = `
        <div class="item-row">
          <div class="item-label">${item}</div>
          <div class="item-amount">${bid}</div>
        </div>
      `;

      if (i < half) leftHTML += row;
      else rightHTML += row;
    });

    left.innerHTML = leftHTML;
    right.innerHTML = rightHTML;

    document.querySelector('.items-grid').style.opacity = 1;

  } catch (e) {
    console.error("Sheet load error", e);
  }
}

loadData();
setInterval(loadData, 5000);
</script>

</body>
</html>
