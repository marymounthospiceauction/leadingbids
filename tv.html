<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Current Leading Bids – TV Display</title>

  <!-- For TVs / big screens this is fine -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Fancy script font for heading (optional) -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet"/>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Calibri, Arial, sans-serif;
      background: #d4af37;
      overflow: hidden; /* no scrolling – fits on TV */
    }

    /* Whole screen container mimicking a poster with border */
    .screen {
      box-sizing: border-box;
      width: 100vw;
      height: 100vh;
      padding: 20px;
      background:
        radial-gradient(circle at top, #fdf6d7 0, #e7c86c 35%, #b58a34 100%);
      border: 12px solid #e8d6a0;
      box-shadow: 0 0 30px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
    }

    /* TITLE */
    .title {
      text-align: center;
      font-family: "Great Vibes", "Brush Script MT", cursive;
      font-size: 4vw;
      color: #000;
      margin-bottom: 1vh;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    /* MAIN AREA: two-column black board */
    .board {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: stretch;
      padding: 1vh 2vw;
    }

    .board-inner {
      width: 100%;
      max-width: 1800px;
      background: #000;
      padding: 1vh 1vw;
      display: flex;
      gap: 1vw;
      box-shadow: 0 0 15px rgba(0,0,0,0.6);
    }

    .column {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.4vh;
    }

    .bid-row {
      display: flex;
      align-items: center;
      background: #111;
      border: 1px solid #444;
      padding: 0.15vh 0.8vw;
      color: #fff;
      font-size: 1.1vw;
      letter-spacing: 0.04em;
    }

    .bid-item {
      flex: 1;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bid-amount {
      width: 7vw;
      min-width: 6vw;
      text-align: right;
      font-weight: bold;
    }

    /* FOOTER WITH LOGOS / QR / WEBSITE */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.7vh 2vw 0;
      font-size: 1.1vw;
    }

    .footer-section {
      display: flex;
      align-items: center;
      gap: 1vw;
    }

    .footer-logo {
      height: 5vh;
      object-fit: contain;
    }

    .footer-qr {
      height: 7vh;
      object-fit: contain;
    }

    .footer-center {
      text-align: center;
      flex: 1;
      font-size: 1.2vw;
      font-weight: bold;
    }

    .footer-center a {
      color: #000;
      text-decoration: none;
    }

    .footer-center a:hover {
      text-decoration: underline;
    }

    /* If screen is smaller (e.g. laptop), keep things readable */
    @media (max-width: 1200px) {
      .bid-row {
        font-size: 1.4vw;
      }
      .title {
        font-size: 5vw;
      }
    }
  </style>
</head>

<body>
  <div class="screen">
    <div class="title">Current Leading Bids</div>

    <div class="board">
      <div class="board-inner">
        <div class="column" id="leftColumn">
          <!-- left column rows injected here -->
        </div>
        <div class="column" id="rightColumn">
          <!-- right column rows injected here -->
        </div>
      </div>
    </div>

    <!-- FOOTER AREA: replace src values with your actual logos / QR codes -->
    <div class="footer">
      <div class="footer-section">
        <!-- Left Marymount logo -->
        <img src="marymount-logo-left.png" alt="Marymount" class="footer-logo">
      </div>

      <div class="footer-section">
        <!-- QR to bid -->
        <div>SCAN<br>QR CODE TO BID</div>
        <img src="qr-bid.png" alt="QR code to bid" class="footer-qr">
      </div>

      <div class="footer-center">
        <a href="https://www.marymountauction2025.ie" target="_blank">
          https://www.marymountauction2025.ie
        </a>
      </div>

      <div class="footer-section">
        <img src="qr-site.png" alt="QR code to website" class="footer-qr">
        <div>SCAN<br>QR CODE TO BID</div>
      </div>

      <div class="footer-section">
        <!-- Right Marymount logo -->
        <img src="marymount-logo-right.png" alt="Marymount" class="footer-logo">
      </div>
    </div>
  </div>

  <script>
    // === GOOGLE SHEET CONFIG ===
    const sheetID   = '1UdOW-OSvZUxlHEzPz0--FDtFcSMTjbZLDo-OhwRr_Mc';
    const sheetName = 'LEADING BIDS';
    const range     = 'Q5:S42'; // Q: Item text, R: New bid, S: Leading bid

    const url =
      `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq` +
      `?tqx=out:json&sheet=${encodeURIComponent(sheetName)}&range=${range}`;

    // Format € values nicely
    function formatEuro(value) {
      if (value === '' || value == null || isNaN(value)) return '€0';
      return '€' + Number(value).toLocaleString('en-IE');
    }

    async function loadBids() {
      try {
        const res  = await fetch(url);
        const text = await res.text();
        const json = JSON.parse(text.substr(47).slice(0, -2));
        const rows = json.table.rows
          .map(r => r.c.map(c => c?.v || ''))
          .filter(r => r[0]); // keep rows with an item

        const leftCol  = document.getElementById('leftColumn');
        const rightCol = document.getElementById('rightColumn');

        leftCol.innerHTML = '';
        rightCol.innerHTML = '';

        // Split rows into two columns: first half left, rest right
        const mid = Math.ceil(rows.length / 2);

        rows.forEach((r, index) => {
          const itemText   = r[0];      // ITEM XX - description
          const leadingVal = r[2];      // S column: Leading Bid
          const amount     = formatEuro(leadingVal);

          const rowEl = document.createElement('div');
          rowEl.className = 'bid-row';

          const itemEl = document.createElement('div');
          itemEl.className = 'bid-item';
          itemEl.textContent = itemText;

          const amountEl = document.createElement('div');
          amountEl.className = 'bid-amount';
          amountEl.textContent = amount;

          rowEl.appendChild(itemEl);
          rowEl.appendChild(amountEl);

          if (index < mid) {
            leftCol.appendChild(rowEl);
          } else {
            rightCol.appendChild(rowEl);
          }
        });

      } catch (err) {
        console.error('Failed to load sheet', err);
      }
    }

    // Initial load and refresh every 30 seconds
    loadBids();
    setInterval(loadBids, 30000);
  </script>
</body>
</html>
