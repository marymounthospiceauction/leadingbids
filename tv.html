<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Current Leading Bids – TV Display</title>

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Script font similar to main branding -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet"/>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Calibri, Arial, sans-serif;

      /* 🔥 USE TV BACKGROUND IMAGE FROM REPO */
      background: url("tvbackground.png") center center/cover no-repeat fixed;
      overflow: hidden;
    }

    .screen {
      box-sizing: border-box;
      width: 100vw;
      height: 100vh;
      padding: 20px;
      border: 14px solid #f6e7c1;
      box-shadow: 0 0 40px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      background: rgba(0,0,0,0.35); /* Transparent overlay for readability */
    }

    /* TITLE */
    .title {
      text-align: center;
      font-family: "Great Vibes", cursive;
      font-size: 4vw;
      color: #fff;
      margin-bottom: 1vh;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    }

    /* MAIN BOARD */
    .board {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: stretch;
      padding: 1vh 1.5vw;
    }

    .board-inner {
      width: 100%;
      max-width: 1900px;
      background: rgba(0,0,0,0.85);
      padding: 1.2vh 1vw;
      display: flex;
      gap: 1vw;
      box-shadow: 0 0 18px rgba(255,255,255,0.15);
      border: 3px solid #f5dd9a;
    }

    .column {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.45vh;
    }

    .bid-row {
      display: flex;
      align-items: center;
      background: #111;
      border: 1px solid #555;
      padding: 0.18vh 0.7vw;
      color: #fdf4dc; /* warm cream */
      font-size: 1.1vw;
      letter-spacing: 0.04em;
    }

    .bid-item {
      flex: 1.1;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 🔥 NEW BID COLUMN IN RED */
    .bid-new {
      flex: 0.5;
      text-align: right;
      padding: 0 0.4vw;
      color: #ff2a2a;   /* bright red */
      font-weight: bold;
    }

    .bid-amount {
      flex: 0.6;
      text-align: right;
      padding-left: 0.4vw;
      font-weight: bold;
      color: #ffd;
    }

    /* FOOTER */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6vh 1.8vw 0;
      font-size: 1.1vw;
      color: #fff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    }

    .footer-left,
    .footer-right {
      display: flex;
      align-items: center;
      gap: 1vw;
    }

    .footer-center {
      text-align: center;
      flex: 1;
      font-size: 1.25vw;
      font-weight: bold;
    }

    .footer-center a {
      color: #fff;
      text-decoration: none;
    }

    .footer-center a:hover {
      text-decoration: underline;
    }

    .footer-logo {
      height: 6vh;
      object-fit: contain;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5));
    }

    .footer-qr-wrap {
      display: flex;
      align-items: center;
      gap: 0.8vw;
      background: rgba(0,0,0,0.6);
      padding: 0.5vh 1vw;
      border-radius: 12px;
      border: 2px solid #f5dd9a;
      box-shadow: 0 0 8px rgba(0,0,0,0.4);
      color: #fff;
    }

    .footer-qr-text {
      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: 0.12em;
      font-size: 0.85vw;
      text-align: center;
    }

    .footer-qr {
      height: 8vh;
      background: #fff;
      padding: 0.4vh;
      border-radius: 6px;
      object-fit: contain;
    }

    @media (max-width: 1200px) {
      .bid-row { font-size: 1.4vw; }
      .title { font-size: 5vw; }
      .footer-qr-text { font-size: 1vw; }
    }
  </style>
</head>

<body>
  <div class="screen">
    <div class="title">Current Leading Bids</div>

    <div class="board">
      <div class="board-inner">
        <div class="column" id="leftColumn"></div>
        <div class="column" id="rightColumn"></div>
      </div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
      <div class="footer-left">
        <img src="Marymount Logo.png" class="footer-logo">
      </div>

      <div class="footer-center">
        <div class="footer-qr-wrap">
          <div class="footer-qr-text">SCAN<br>QR CODE TO BID</div>
          <img src="2025 Marymount QR Code.jpeg" class="footer-qr">
        </div>
      </div>

      <div class="footer-right">
        <span>www.marymountauction2025.ie</span>
      </div>
    </div>
  </div>

  <script>
    const sheetID   = '1UdOW-OSvZUxlHEzPz0--FDtFcSMTjbZLDo-OhwRr_Mc';
    const sheetName = 'LEADING BIDS';
    const range     = 'Q5:S42';

    const url =
      `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq` +
      `?tqx=out:json&sheet=${encodeURIComponent(sheetName)}&range=${range}`;

    function formatEuro(value) {
      if (!value || isNaN(value)) return "€0";
      return "€" + Number(value).toLocaleString("en-IE");
    }

    async function loadBids() {
      try {
        const res  = await fetch(url);
        const text = await res.text();
        const json = JSON.parse(text.substr(47).slice(0, -2));
        const rows = json.table.rows.map(r => r.c.map(c => c?.v || '')).filter(r => r[0]);

        const leftCol  = document.getElementById('leftColumn');
        const rightCol = document.getElementById('rightColumn');

        leftCol.innerHTML = '';
        rightCol.innerHTML = '';

        const mid = Math.ceil(rows.length / 2);

        rows.forEach((r, index) => {
          const row = document.createElement('div');
          row.className = 'bid-row';

          row.innerHTML = `
            <div class="bid-item">${r[0]}</div>
            <div class="bid-new">${r[1] ? formatEuro(r[1]) : ""}</div>
            <div class="bid-amount">${formatEuro(r[2])}</div>
          `;

          if (index < mid) leftCol.appendChild(row);
          else rightCol.appendChild(row);
        });

      } catch (err) { console.error(err); }
    }

    loadBids();
    setInterval(loadBids, 30000);
  </script>
</body>
</html>
