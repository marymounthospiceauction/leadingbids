<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Current Leading Bids – Marymount Auction</title>

<style>
    body {
        margin: 0;
        padding: 0;
        background: url("tvbackground.png") center/cover no-repeat fixed;
        font-family: Arial, sans-serif;
        color: #ffe599;
        overflow: hidden;
    }

    /* HEADER IMAGE */
    .header-wrapper {
        width: 100%;
        text-align: center;
        padding-top: 10px;
    }

    .header-image {
        width: 90%;
        max-width: 1600px;
        height: auto;
        display: block;
        margin: 0 auto 10px auto;
    }

    /* TABLE STYLES */
    .table-container {
        width: 95%;
        margin: 0 auto;
        margin-top: 5px;
        border: 2px solid #ffe599;
        padding: 10px;
        background: rgba(0, 0, 0, 0.8);
    }

    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 22px;
    }

    td {
        border: 1px solid #ffe599;
        padding: 6px 10px;
        white-space: nowrap;
    }

    .newbid {
        color: red;
        font-size: 18px;
        font-weight: bold;
        text-align: center;
    }

    .last-update {
        position: absolute;
        top: 20px;
        right: 30px;
        color: #ffe599;
        font-size: 20px;
        font-weight: bold;
        text-shadow: 0 0 5px black;
    }

    /* FOOTER */
    .footer-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 95%;
        margin: 15px auto 5px auto;
    }

    .footer-box {
        text-align: center;
        color: black;
        font-weight: bold;
        background: #ffe599;
        padding: 6px 10px;
        border-radius: 6px;
        margin-bottom: 5px;
    }

    .qr {
        width: 140px;
        height: auto;
    }

    .footer-sponsors {
        width: 45%;
        max-width: 900px;
        display: block;
        margin: 0 20px;
    }

</style>
</head>

<body>

<div class="last-update" id="lastUpdate">Loading...</div>

<!-- HEADER IMAGE -->
<div class="header-wrapper">
    <img src="LiveHeader_transparent.png" class="header-image" alt="Starry Night Header">
</div>

<!-- TABLE -->
<div class="table-container">
    <table id="bidsTable"></table>
</div>

<!-- FOOTER -->
<div class="footer-row">

    <!-- LEFT QR CODE -->
    <div>
        <div class="footer-box">SCAN QR CODE TO BID</div>
        <img src="2025 Marymount QR Code.jpeg" class="qr">
    </div>

    <!-- SPONSORS -->
    <img src="Marymount Footer Sponsors.png" class="footer-sponsors">

    <!-- RIGHT QR CODE -->
    <div>
        <div class="footer-box">SCAN QR CODE TO BID</div>
        <img src="2025 Marymount QR Code.jpeg" class="qr">
    </div>

</div>

<script>
const sheetID = '1UdOW-OSvZUxlHEzPz0--FDtFcSMTjbZLDo-OhwRr_Mc';
const sheetName = 'LEADING BIDS';
const range = 'U5:W39';
const url = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json&sheet=${sheetName}&range=${range}`;

function formatEuro(v) {
    if (!v || isNaN(v)) return '€0';
    return '€' + Number(v).toLocaleString('en-IE');
}

async function loadData() {
    try {
        const res = await fetch(url);
        const text = await res.text();
        const json = JSON.parse(text.substr(47).slice(0, -2));

        const rows = json.table.rows.map(r => r.c.map(c => c?.v || ''));

        let html = '';
        rows.forEach(r => {
            html += `
                <tr>
                    <td>${r[0]}</td>
                    <td class="newbid">${r[1] ? "NEW BID!" : ""}</td>
                    <td>${formatEuro(r[2])}</td>
                </tr>
            `;
        });

        document.getElementById("bidsTable").innerHTML = html;

        // Update timestamp
        document.getElementById("lastUpdate").innerText =
            "Last update: " + new Date().toLocaleTimeString('en-IE', { hour12: false });

    } catch (e) {
        console.error("Error loading data", e);
    }
}

loadData();
setInterval(loadData, 5000); // 5-second refresh
</script>

</body>
</html>
