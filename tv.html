<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Starry Night Ball – Leading Bids</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Google Font for Alisha -->
<link href="https://fonts.googleapis.com/css2?family=Alisha&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    padding: 0;
    background: #000 url("tvbackground.png") center/cover no-repeat fixed;
    font-family: Arial, sans-serif;
    color: #ffe599;
    overflow: hidden;
  }

  /* HEADER */
  .title-bar {
    width: 96vw;
    margin: 10px auto 5px auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header-logo {
    height: 70px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.7));
  }
  .title-text {
    flex: 1;
    text-align: center;
    font-family: 'Alisha', cursive;
    font-size: 3vw;
    color: #ffe8a3;
    text-shadow: 0 0 8px rgba(0,0,0,0.9);
    letter-spacing: 0.05em;
    white-space: nowrap;
  }
  .subtitle {
    display: block;
    font-size: 1.5vw;
    text-transform: uppercase;
    margin-top: 4px;
  }
  .last-update {
    min-width: 120px;
    text-align: right;
    font-size: 0.8vw;
    color: #000;
    font-weight: bold;
    line-height: 1.2;
  }

  /* MAIN BOARD */
  .board {
    display: flex;
    justify-content: center;
    gap: 4vw;
    width: 96vw;
    margin: 10px auto;
    background: rgba(0,0,0,0.85);
    border: 2px solid #ffe599;
    padding: 10px;
    box-sizing: border-box;
    height: 70vh;
  }

  table {
    width: 45vw;
    border-collapse: collapse;
    font-size: 1vw;
  }

  th {
    text-align: left;
    font-size: 0.8vw;
    color: #ffe8a3;
    text-transform: uppercase;
    border-bottom: 2px solid #ffe599;
    padding-bottom: 4px;
  }

  td {
    padding: 4px 8px;
    border-bottom: 1px dotted #ffe599;
    white-space: nowrap;
  }

  .item-desc {
    width: 60%;
  }
  .new-bid {
    text-align: center;
    width: 15%;
    color: red;
    font-weight: bold;
    font-size: 0.9vw;
  }
  .bid {
    text-align: center;
    font-weight: bold;
    width: 25%;
  }

  /* FOOTER */
  .footer-row {
    width: 96vw;
    margin: 4px auto 5px auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 2px solid #ffe599;
    padding-top: 10px;
  }
  .footer-box {
    color: #000;
    font-weight: bold;
    font-size: 1.2vw;
    margin-bottom: 6px;
  }
  .qr {
    width: 160px;
    background: #fff;
    padding: 5px;
    border-radius: 4px;
  }
  .footer-sponsors {
    max-height: 14vh;
    display: block;
  }
</style>
</head>
<body>

<!-- HEADER -->
<div class="title-bar">
  <img src="Marymount Logo.png" class="header-logo">
  <div class="title-text">
    The Starry Night Ball
    <span class="subtitle">Leading Bids</span>
  </div>
  <img src="Marymount Logo.png" class="header-logo">
  <div class="last-update" id="lastUpdate">Last update:<br>--:--:--</div>
</div>

<!-- MAIN BOARD -->
<div class="board">
  <table>
    <thead>
      <tr><th>Item Description</th><th>New Bid</th><th>Leading Bid</th></tr>
    </thead>
    <tbody id="leftBody"></tbody>
  </table>

  <table>
    <thead>
      <tr><th>Item Description</th><th>New Bid</th><th>Leading Bid</th></tr>
    </thead>
    <tbody id="rightBody"></tbody>
  </table>
</div>

<!-- FOOTER -->
<div class="footer-row">
  <div style="text-align:center">
    <div class="footer-box">SCAN QR CODE TO BID</div>
    <img src="2025 Marymount QR Code.jpeg" class="qr">
  </div>

  <img src="Marymount Footer Sponsors.png" class="footer-sponsors">

  <div style="text-align:center">
    <div class="footer-box">SCAN QR CODE TO BID</div>
    <img src="2025 Marymount QR Code.jpeg" class="qr">
  </div>
</div>

<!-- DATA SCRIPT -->
<script>
const sheetID   = '1UdOW-OSvZUxlHEzPz0--FDtFcSMTjbZLDo-OhwRr_Mc';
const sheetName = 'LEADING BIDS';
const range     = 'U4:W39';

const url =
  `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json` +
  `&sheet=${encodeURIComponent(sheetName)}&range=${range}`;

function formatEuro(v){
  if(!v || isNaN(v)) return '€0';
  return '€' + Number(v).toLocaleString('en-IE');
}

async function loadData(){
  try{
    const res  = await fetch(url);
    const text = await res.text();
    const json = JSON.parse(text.substr(47).slice(0, -2));

    const allRows = json.table.rows.map(r => r.c.map(c => c?.v || ''));
    const rows = allRows.slice(1).filter(r => r[0]);

    const mid = Math.ceil(rows.length/2);
    const left  = rows.slice(0, mid);
    const right = rows.slice(mid);

    function build(list, offset){
      return list.map((r, i) => `
        <tr>
          <td class="item-desc">ITEM ${offset + i + 1} – ${r[0]}</td>
          <td class="new-bid">${r[1] ? 'NEW BID!' : ''}</td>
          <td class="bid">${formatEuro(r[2])}</td>
        </tr>`).join('');
    }

    leftBody.innerHTML  = build(left, 0);
    rightBody.innerHTML = build(right, mid);

    const now = new Date();
    lastUpdate.innerHTML =
      "Last update:<br>" + now.toLocaleTimeString("en-IE",{hour12:false});
  }
  catch(e){ console.error(e); }
}

loadData();
setInterval(loadData, 10000); // Refresh every 10 seconds
</script>

</body>
</html>
