<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Starry Night Ball – Leading Bids</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Alisha font for title -->
  <link href="https://fonts.googleapis.com/css2?family=Alisha&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: url("tvbackground.png") center/cover no-repeat fixed;
      font-family: Arial, sans-serif;
      color: #ffe599;
      overflow: hidden;
    }

    /* TOP TITLE BAR */
    .title-bar {
      width: 95vw;
      margin: 8px auto 4px auto;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }

    .title-text {
      flex: 1;
      text-align: center;
      font-family: 'Alisha', cursive;
      font-size: 3vw;
      color: #ffe8a3;
      text-shadow:
        -2px -2px 4px rgba(0,0,0,0.9),
         2px -2px 4px rgba(0,0,0,0.9),
        -2px  2px 4px rgba(0,0,0,0.9),
         2px  2px 4px rgba(0,0,0,0.9);
      letter-spacing: 0.06em;
    }

    .last-update {
      min-width: 190px;
      text-align: right;
      font-size: 1.1vw;
      color: #ffe599;
      text-shadow: 0 0 4px rgba(0,0,0,0.9);
    }

    /* TABLE AREA */
    .table-container {
      width: 95vw;
      margin: 2px auto 4px auto;
      border: 2px solid #ffe599;
      padding: 6px;
      background: rgba(0,0,0,0.85);
      box-sizing: border-box;

      /* Keep everything on one screen */
      height: 70vh;
      display: flex;
      align-items: stretch;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 18px;        /* slightly smaller to fit all rows */
    }

    td {
      border: 1px solid #ffe599;
      padding: 4px 8px;
      white-space: nowrap;
    }

    td:nth-child(1) {
      width: 63%;
      text-transform: uppercase;
    }

    td:nth-child(2) {
      width: 12%;
      text-align: center;
    }

    td:nth-child(3) {
      width: 25%;
      text-align: right;
    }

    .newbid {
      color: red;
      font-size: 16px;        /* smaller than main text */
      font-weight: bold;
    }

    /* FOOTER – QR + SPONSORS */
    .footer-row {
      width: 95vw;
      margin: 4px auto 6px auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-box {
      text-align: center;
      color: #000;
      font-weight: bold;
      background: #ffe599;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.9vw;
      letter-spacing: 0.12em;
    }

    .qr {
      width: 110px;
      height: auto;
      margin-top: 4px;
      box-shadow: 0 0 6px rgba(0,0,0,0.7);
      border-radius: 4px;
      background: #fff;
      padding: 4px;
    }

    .footer-sponsors {
      width: 40vw;
      max-width: 900px;
      display: block;
      margin: 0 20px;
    }
  </style>
</head>
<body>

  <!-- TITLE + LAST UPDATE -->
  <div class="title-bar">
    <div style="width:190px;"></div>
    <div class="title-text">The Starry Night Ball</div>
    <div class="last-update" id="lastUpdate">Last update: --:--:--</div>
  </div>

  <!-- TABLE -->
  <div class="table-container">
    <table id="bidsTable"></table>
  </div>

  <!-- FOOTER -->
  <div class="footer-row">

    <!-- LEFT QR -->
    <div>
      <div class="footer-box">SCAN QR CODE&nbsp;&nbsp;TO BID</div>
      <img src="2025 Marymount QR Code.jpeg" class="qr" alt="QR to bid">
    </div>

    <!-- SPONSORS -->
    <img src="Marymount Footer Sponsors.png" class="footer-sponsors" alt="Sponsors">

    <!-- RIGHT QR -->
    <div>
      <div class="footer-box">SCAN QR CODE&nbsp;&nbsp;TO BID</div>
      <img src="2025 Marymount QR Code.jpeg" class="qr" alt="QR to bid">
    </div>

  </div>

  <script>
    const sheetID   = '1UdOW-OSvZUxlHEzPz0--FDtFcSMTjbZLDo-OhwRr_Mc';
    const sheetName = 'LEADING BIDS';
    const range     = 'U5:W39';   // <<< updated range

    const url =
      `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq` +
      `?tqx=out:json&sheet=${encodeURIComponent(sheetName)}&range=${range}`;

    function formatEuro(v) {
      if (!v || isNaN(v)) return '€0';
      return '€' + Number(v).toLocaleString('en-IE');
    }

    async function loadData() {
      try {
        const res  = await fetch(url);
        const text = await res.text();
        const json = JSON.parse(text.substr(47).slice(0, -2));

        const rows = json.table.rows.map(r => r.c.map(c => c?.v || ''));

        let html = '';
        rows.forEach(r => {
          const item  = r[0];
          const flag  = r[1];   // any non-empty value means “NEW BID”
          const lead  = r[2];

          html += `
            <tr>
              <td>${item}</td>
              <td class="newbid">${flag ? 'NEW BID!' : ''}</td>
              <td>${formatEuro(lead)}</td>
            </tr>
          `;
        });

        document.getElementById('bidsTable').innerHTML = html;

        // update timestamp
        const now = new Date();
        const timeStr = now.toLocaleTimeString('en-IE', {
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: false
        });
        document.getElementById('lastUpdate').textContent =
          'Last update: ' + timeStr;

      } catch (err) {
        console.error('Failed to load sheet', err);
      }
    }

    loadData();
    setInterval(loadData, 5000);  // refresh every 5 seconds
  </script>

</body>
</html>
