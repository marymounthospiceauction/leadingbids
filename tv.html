<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Starry Night Ball – Leading Bids</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Alisha&display=swap" rel="stylesheet">

  <!-- ======================= -->
  <!--        TV STYLING       -->
  <!-- ======================= -->
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      background: url("tvbackground.png") center/cover no-repeat fixed;
      font-family: Arial, sans-serif;
      color: #ffe599;
      overflow: hidden;

      font-size: clamp(18px, 1vw + 0.3vh, 26px);

      display: flex;
      flex-direction: column;

      cursor: none;
      user-select: none;
    }

    /* HEADER BAR */
    .title-bar {
      width: 96vw;
      margin: 10px auto 5px auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-logo {
      height: clamp(50px, 5vh, 80px);
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.7));
    }

    .title-text {
      flex: 1;
      text-align: center;
      font-family: 'Alisha', cursive;
      font-size: clamp(32px, 3vw, 60px);
      color: #ffe8a3;
      text-shadow: 0 0 6px rgba(0, 0, 0, 0.9);
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    .last-update {
      min-width: 160px;
      text-align: right;
      font-size: clamp(14px, 1vw, 20px);
      text-shadow: 0 0 4px rgba(0, 0, 0, 0.8);
    }

    /* MAIN BOARD */
    .board {
      width: 96vw;
      margin: 0 auto;
      flex: 1;
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #ffe599;
      padding: 10px;
      display: flex;
      box-sizing: border-box;
    }

    .board-inner {
      width: 100%;
      display: flex;
      gap: 1vw;
    }

    .column {
      flex: 1;
    }

    /* TABLE */
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th, td {
      border: 1px solid #ffe599;
      white-space: nowrap;
      padding: 0.35vh 0.5vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Remove internal borders */
    td:nth-child(1), th:nth-child(1) { border-right: none; }
    td:nth-child(2), th:nth-child(2) { border-left: none; border-right: none; }
    td:nth-child(3), th:nth-child(3) { border-left: none; }

    /* Header style */
    th {
      background: rgba(255, 229, 153, 0.25);
      font-size: clamp(12px, 0.9vw, 16px);
      text-transform: uppercase;
      color: #ffe8a3;
      text-shadow: 0 0 3px rgba(0, 0, 0, 0.8);
    }

    /* Column sizing */
    td:nth-child(1), th:nth-child(1) {
      width: 70%;
      max-width: 0;
      font-size: clamp(18px, 1.4vw, 30px);
    }

    td:nth-child(2), th:nth-child(2) {
      width: 8%;
      text-align: center;
      font-size: clamp(14px, 1vw, 20px);
    }

    td:nth-child(3), th:nth-child(3) {
      width: 22%;
      text-align: right;
      font-size: clamp(18px, 1.4vw, 30px);
      font-weight: bold;
    }

    /* NEW BID badge */
    .newbid {
      display: inline-block;
      color: #000;
      background: #ff4d4d;
      padding: 0.1em 0.4em;
      border-radius: 999px;
      font-size: clamp(14px, 1vw, 20px);
      font-weight: bold;
      text-align: center;
    }

    @keyframes pulseNewBid {
      0%,100% {
        transform: scale(1);
        box-shadow: 0 0 6px rgba(255, 77, 77, 0.7);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 0 12px rgba(255, 77, 77, 1);
      }
    }

    .newbid:not(:empty) {
      animation: pulseNewBid 1.5s ease-in-out infinite;
    }

    /* FOOTER */
    .footer-row {
      width: 96vw;
      margin: 4px auto 10px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-box {
      background: #ffe599;
      color: #000;
      font-weight: bold;
      padding: 6px 16px;
      border-radius: 6px;
      font-size: clamp(14px, 1vw, 18px);
      letter-spacing: 0.08em;
    }

    .qr {
      width: clamp(110px, 7vw, 180px);
      margin-top: 6px;
      background: #fff;
      padding: 8px;
      border-radius: 4px;
    }

    .footer-sponsors {
      max-height: 14vh;
      width: auto;
      display: block;
    }

  </style>
</head>

<body>

  <!-- HEADER -->
  <div class="title-bar">
    <img src="Marymount Logo.png" class="header-logo">
    <div class="title-text">The Starry Night Ball</div>
    <img src="Marymount Logo.png" class="header-logo">
    <div class="last-update" id="lastUpdate">Loading…</div>
  </div>

  <!-- MAIN BOARD -->
  <div class="board">
    <div class="board-inner">

      <!-- LEFT TABLE -->
      <div class="column">
        <table>
          <thead>
            <tr>
              <th>Item Description</th>
              <th>New Bid</th>
              <th>Leading Bid</th>
            </tr>
          </thead>
          <tbody id="leftBody">
            <tr><td colspan="3">Loading bids…</td></tr>
          </tbody>
        </table>
      </div>

      <!-- RIGHT TABLE -->
      <div class="column">
        <table>
          <thead>
            <tr>
              <th>Item Description</th>
              <th>New Bid</th>
              <th>Leading Bid</th>
            </tr>
          </thead>
          <tbody id="rightBody">
            <tr><td colspan="3">Loading bids…</td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer-row">

    <div style="text-align:center">
      <div class="footer-box">SCAN QR CODE TO BID</div>
      <img src="2025 Marymount QR Code.jpeg" class="qr">
    </div>

    <img src="Marymount Footer Sponsors.png" class="footer-sponsors">

    <div style="text-align:center">
      <div class="footer-box">SCAN QR CODE TO BID</div>
      <img src="2025 Marymount QR Code.jpeg" class="qr">
    </div>

  </div>

  <!-- ======================= -->
  <!--          JS             -->
  <!-- ======================= -->
  <script>
    const sheetID   = '1UdOW-OSvZUxlHEzPz0--FDtFcSMTjbZLDo-OhwRr_Mc';
    const sheetName = 'LEADING BIDS';
    const range     = 'U4:W39';

    const url =
      `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json` +
      `&sheet=${encodeURIComponent(sheetName)}&range=${range}`;

    function formatEuro(v){
      if(!v || isNaN(v)) return '€0';
      return '€' + Number(v).toLocaleString('en-IE');
    }

    async function loadData(){
      try{
        const res  = await fetch(url, { cache: "no-store" });
        const text = await res.text();
        const json = JSON.parse(text.substr(47).slice(0, -2));

        const allRows = json.table.rows.map(r => r.c.map(c => c?.v || ''));
        const rows = allRows.slice(1).filter(r => r[0]);

        const mid = Math.ceil(rows.length/2);
        const left  = rows.slice(0, mid);
        const right = rows.slice(mid);

        function build(list){
          if (!list.length) {
            return `<tr><td colspan="3">No items to display</td></tr>`;
          }
          return list.map(r => `
            <tr>
              <td>${r[0]}</td>
              <td class="newbid">${r[1] ? 'NEW BID!' : ''}</td>
              <td>${formatEuro(r[2])}</td>
            </tr>`).join('');
        }

        leftBody.innerHTML  = build(left);
        rightBody.innerHTML = build(right);

        const now = new Date();
        lastUpdate.textContent =
          "Last update: " + now.toLocaleTimeString("en-IE",{hour12:false});
      }
      catch(e){
        console.error(e);
        lastUpdate.textContent = "Last update: ERROR – retrying…";
      }
    }

    loadData();
    setInterval(loadData, 5000);
  </script>

</body>
</html>
