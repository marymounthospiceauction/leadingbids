<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Starry Night Ball – Leading Bids</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    padding: 0;
    background: #000 url("tvbackground.png") center/cover no-repeat fixed;
    font-family: Arial, sans-serif;
    color: #ffe599;
    overflow: hidden;
  }

  /* HEADER */
  .header {
    text-align: center;
    font-size: 3vw;
    font-weight: bold;
    color: #ffe8a3;
    text-shadow: 0 0 8px rgba(0,0,0,0.9);
    margin: 10px 0;
  }
  .last-update {
    text-align: center;
    font-size: 1.2vw;
    color: #fff;
    margin-bottom: 10px;
  }

  /* MAIN BOARD */
  .board {
    display: flex;
    justify-content: center;
    gap: 4vw;
    width: 96vw;
    margin: auto;
    background: rgba(0,0,0,0.85);
    border: 2px solid #ffe599;
    padding: 10px;
    box-sizing: border-box;
  }

  table {
    width: 45vw;
    border-collapse: collapse;
    font-size: 1vw;
  }

  th {
    text-align: left;
    font-size: 1vw;
    color: #ffe8a3;
    text-transform: uppercase;
    border-bottom: 2px solid #ffe599;
    padding-bottom: 6px;
  }

  td {
    padding: 4px 8px;
    border-bottom: 1px dotted #ffe599;
    white-space: nowrap;
  }

  .item-desc {
    width: 70%;
  }
  .bid {
    text-align: right;
    font-weight: bold;
    width: 30%;
  }

  .newbid {
    color: red;
    font-size: 0.9vw;
    font-weight: bold;
    margin-left: 8px;
    animation: pulse 1s infinite alternate;
  }

  @keyframes pulse {
    from { opacity: 0.5; }
    to { opacity: 1; }
  }

  /* FOOTER */
  .footer-row {
    width: 96vw;
    margin: 10px auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 2px solid #ffe599;
    padding-top: 10px;
  }
  .footer-box {
    text-align: center;
    color: #ffe599;
    font-size: 1.2vw;
    font-weight: bold;
    margin-bottom: 6px;
  }
  .qr {
    width: 150px;
    background: #fff;
    padding: 5px;
    border-radius: 4px;
  }
  .footer-sponsors {
    max-height: 12vh;
    display: block;
  }
</style>
</head>
<body>

<div class="header">The Starry Night Ball – Leading Bids</div>
<div class="last-update" id="lastUpdate">Last update: --:--:--</div>

<div class="board">
  <table>
    <thead>
      <tr><th>Item</th><th>Leading Bid</th></tr>
    </thead>
    <tbody id="leftBody"></tbody>
  </table>

  <table>
    <thead>
      <tr><th>Item</th><th>Leading Bid</th></tr>
    </thead>
    <tbody id="rightBody"></tbody>
  </table>
</div>

<!-- FOOTER -->
<div class="footer-row">
  <div>
    <div class="footer-box">SCAN QR CODE TO BID</div>
    <img src="2025 Marymount QR Code.jpeg" class="qr">
  </div>

  <img src="Marymount Footer Sponsors.png" class="footer-sponsors">

  <div>
    <div class="footer-box">SCAN QR CODE TO BID</div>
    <img src="2025 Marymount QR Code.jpeg" class="qr">
  </div>
</div>

<script>
const sheetID   = '1UdOW-OSvZUxlHEzPz0--FDtFcSMTjbZLDo-OhwRr_Mc';
const sheetName = 'LEADING BIDS';
const range     = 'U4:W39';

const url =
  `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json` +
  `&sheet=${encodeURIComponent(sheetName)}&range=${range}`;

function formatEuro(v){
  if(!v || isNaN(v)) return '€0';
  return '€' + Number(v).toLocaleString('en-IE');
}

async function loadData(){
  try{
    const res  = await fetch(url);
    const text = await res.text();
    const json = JSON.parse(text.substr(47).slice(0, -2));

    const allRows = json.table.rows.map(r => r.c.map(c => c?.v || ''));
    const rows = allRows.slice(1).filter(r => r[0]);

    const mid = Math.ceil(rows.length/2);
    const left  = rows.slice(0, mid);
    const right = rows.slice(mid);

    function build(list, offset){
      return list.map((r, i) => `
        <tr>
          <td class="item-desc">ITEM ${offset + i + 1} – ${r[0]} ${r[1] ? '<span class="newbid">NEW BID!</span>' : ''}</td>
          <td class="bid">${formatEuro(r[2])}</td>
        </tr>`).join('');
    }

    leftBody.innerHTML  = build(left, 0);
    rightBody.innerHTML = build(right, mid);

    const now = new Date();
    lastUpdate.textContent =
      "Last update: " + now.toLocaleTimeString("en-IE",{hour12:false});
  }
  catch(e){ console.error(e); }
}

loadData();
setInterval(loadData, 10000); // Refresh every 10 seconds
</script>

</body>
</html>
